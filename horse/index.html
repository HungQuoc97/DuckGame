<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Survival Derby - Wide Track</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;900&family=Roboto+Condensed:wght@700&display=swap"
        rel="stylesheet">
    <style>
        /* --- MERGED STYLES FROM DUCK-V2 & HORSE --- */
        :root {
            --tet-red: #D32F2F;
            --tet-gold: #FFD700;
            --tet-yellow: #FFEB3B;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-light: #ffffff;
            --text-dim: #dddddd;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Roboto', sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        /* --- BACKGROUND & DECOR (Duck-V2) --- */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("../Ticke.me Fake/bg-y1.png");
            background-position: 50%;
            background-repeat: repeat;
            z-index: -1;
        }

        .bg-image::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(255, 107, 107, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(241, 196, 15, 0.2) 0%, transparent 50%),
                linear-gradient(135deg, rgba(113, 0, 209, 0.15) 0%, rgba(188, 86, 252, 0.25) 100%);
            z-index: 0;
            pointer-events: none;
            animation: gradientShift 10s ease infinite;
        }

        @keyframes gradientShift {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.8;
            }
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: -1;
        }

        .decor-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .decor-item {
            position: absolute;
        }

        .decor-lanterns {
            top: 60px;
            right: 50px;
            width: 150px;
            /* animation: swing 3s ease-in-out infinite alternate; REMOVED */
            transform-origin: top center;
            transform: rotate(5deg);
            /* Static tilt */
        }

        /* @keyframes swing REMOVED */

        /* --- CONTAINER STRUCTURE (Duck-V2) --- */
        .main-game-container {
            width: 95%;
            max-width: 1400px;
            height: 90vh;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            display: flex;
            overflow: hidden;
            position: relative;
            z-index: 10;
        }

        .game-stage {
            flex-grow: 1;
            position: relative;
            background: transparent;
            /* Horse game draws its own background */
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        /* --- LEFT PANEL STYLES (MATCHING DUCK V2) --- */
        .controls-panel {
            width: 300px;
            min-width: 300px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-right: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
            color: var(--text-light);
            z-index: 10;
        }

        .panel-header {
            font-family: 'Roboto', sans-serif;
            font-weight: 900;
            font-size: 2rem;
            text-transform: uppercase;
            background: linear-gradient(45deg, var(--tet-gold), var(--tet-red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 10px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
        }

        .btn-nav {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: var(--text-dim);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Roboto Condensed', sans-serif;
            text-transform: uppercase;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
            display: block;
        }

        .btn-nav:hover {
            border-color: var(--tet-gold);
            color: var(--tet-gold);
            background: rgba(255, 215, 0, 0.1);
        }

        .prize-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .prize-name {
            font-family: 'Roboto', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            color: var(--tet-gold);
            margin-bottom: 5px;
        }

        .prize-count {
            font-size: 0.9rem;
            color: var(--text-dim);
            font-style: italic;
        }

        .settings-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 12px;
        }

        .input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-direction: row;
            /* Override previous column layout */
        }

        .input-group label {
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 0;
        }

        .input-group input,
        .input-group select {
            width: 80px;
            padding: 5px;
            border-radius: 6px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.4);
            color: var(--tet-gold);
            text-align: center;
            font-weight: bold;
        }

        .timer-display {
            font-family: 'Courier New', monospace;
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--tet-gold);
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--tet-gold);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        .btn-action {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-family: 'Roboto', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-start {
            background: linear-gradient(135deg, var(--tet-gold), #FFA000);
            color: #b71c1c;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.6);
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            border: 1px solid var(--glass-border);
        }

        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Rank Board Scoped */
        .rank-board {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 180px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            border-radius: 12px;
            padding: 15px;
            color: white;
            border: 1px solid rgba(255, 215, 0, 0.3);
            pointer-events: none;
            z-index: 50;
        }

        #sinkhole-alert {
            position: absolute;
            /* Changed to absolute */
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(255, 0, 0, 0.9);
            color: yellow;
            padding: 20px 40px;
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            border: 5px solid yellow;
            border-radius: 10px;
            z-index: 150;
            box-shadow: 0 0 30px red;
            text-align: center;
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
        }

        #sinkhole-alert.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        #ui-layer {
            position: absolute;
            /* Changed to absolute */
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        label {
            color: #aaa;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 3px;
        }

        input[type="number"] {
            width: 60px;
            padding: 5px;
            text-align: center;
            font-weight: 900;
            border-radius: 6px;
            border: 2px solid #555;
            background: #222;
            color: white;
            font-size: 16px;
            transition: 0.3s;
        }

        input[type="number"]:focus {
            border-color: #ff9800;
            outline: none;
        }

        #timer {
            background: #111;
            color: #ffeb3b;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 24px;
            font-weight: bold;
            padding: 5px 15px;
            min-width: 120px;
            text-align: center;
            border: 1px solid #444;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
            text-shadow: 0 0 5px #ffeb3b;
        }

        button {
            padding: 10px 25px;
            font-weight: 900;
            font-size: 14px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            color: white;
            text-transform: uppercase;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
        }

        #btn-start {
            background: linear-gradient(135deg, #FF6F00, #FFca28);
        }

        #btn-reset {
            background: linear-gradient(135deg, #d32f2f, #ef5350);
        }

        button:disabled {
            background: #555 !important;
            cursor: not-allowed;
            opacity: 0.5;
            box-shadow: none;
        }

        #loading-status {
            font-weight: bold;
            color: #fff;
            background: #0277BD;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 11px;
            text-transform: uppercase;
        }

        #rank-board {
            position: absolute;
            /* Changed to absolute */
            top: 90px;
            right: 20px;
            width: 180px;
            background: rgba(20, 20, 20, 0.85);
            color: white;
            border-radius: 12px;
            padding: 15px;
            font-size: 13px;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 50;
            backdrop-filter: blur(5px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }

        .rank-title {
            text-align: center;
            font-weight: 900;
            border-bottom: 2px solid #444;
            padding-bottom: 5px;
            margin-bottom: 10px;
            color: #aaa;
            letter-spacing: 1px;
        }

        .r-item {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px 0;
            align-items: center;
        }

        .r-badge {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        #winner-screen {
            display: none;
            position: absolute;
            /* Changed to absolute */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 200;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            backdrop-filter: blur(8px);
            opacity: 0;
            transition: opacity 0.5s;
        }

        .win-box {
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            padding: 40px 60px;
            border-radius: 30px;
            text-align: center;
            border: 8px solid #FFD700;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.6), inset 0 0 20px rgba(255, 255, 255, 1);
            transform: scale(0.8);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .win-box::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.8), transparent);
            transform: skewX(-25deg);
            animation: shine 3s infinite;
        }

        .trophy-icon {
            font-size: 60px;
            margin-bottom: 10px;
            filter: drop-shadow(0 5px 5px rgba(0, 0, 0, 0.3));
        }

        .win-title {
            margin: 0;
            color: #555;
            font-size: 18px;
            letter-spacing: 2px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .win-name {
            font-size: 50px;
            margin: 15px 0;
            font-weight: 900;
            text-transform: uppercase;
            -webkit-text-stroke: 2px #fff;
            text-shadow: 3px 3px 0px rgba(0, 0, 0, 0.2);
        }

        .win-img-container {
            width: 180px;
            height: 120px;
            background: radial-gradient(circle, rgba(0, 0, 0, 0.1) 0%, transparent 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        #btn-replay {
            background: linear-gradient(90deg, #FF9800, #FF5722);
            padding: 15px 40px;
            font-size: 18px;
            box-shadow: 0 10px 20px rgba(255, 87, 34, 0.4);
            animation: pulse 1.5s infinite;
        }

        #horse-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 10;
        }

        .horse-wrapper {
            position: absolute;
            width: 120px;
            height: 100px;
            will-change: transform;
            transition: z-index 0.1s;
        }

        .horse-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.3s, filter 0.3s;
            filter: drop-shadow(0 10px 5px rgba(0, 0, 0, 0.3));
        }

        .saddle-number {
            position: absolute;
            top: 52%;
            left: 42%;
            transform: translate(-50%, -50%) rotate(-5deg) skewX(-5deg);
            background: linear-gradient(to bottom, #ffffff, #f0f0f0);
            color: #222;
            width: 45px;
            /* Increased from 20px */
            height: 18px;
            /* Increased from 16px */
            border-radius: 3px;
            border: 1px dashed #666;
            font-family: 'Roboto Condensed', sans-serif;
            font-weight: 900;
            font-size: 9px;
            /* Decreased from 11px to fit YEG... */
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3), inset 0 0 1px rgba(0, 0, 0, 0.1);
            z-index: 5;
            pointer-events: none;
            white-space: nowrap;
            /* Prevent wrapping */
            overflow: hidden;
            /* Clip if too long */
        }

        .chat-bubble {
            position: absolute;
            top: -40px;
            left: 20px;
            background: white;
            color: #333;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
            z-index: 20;
            animation: popUp 1.5s forwards;
        }

        .chat-bubble::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 10px;
            border-width: 5px 5px 0;
            border-style: solid;
            border-color: white transparent;
        }

        @keyframes shine {
            0% {
                left: -100%;
            }

            20% {
                left: 200%;
            }

            100% {
                left: 200%;
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes popUp {
            0% {
                transform: translateY(10px);
                opacity: 0;
            }

            10% {
                transform: translateY(0);
                opacity: 1;
            }

            80% {
                opacity: 1;
            }

            100% {
                transform: translateY(-10px);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>
    <div class="decor-container">
        <img src="../Ticke.me Fake/y1-logo.png" class="decor-item decor-lanterns" alt="Lồng Đèn"
            onerror="this.style.display='none'">
    </div>

    <div class="main-game-container">
        <!-- LEFT PANEL: CONTROLS -->
        <div class="controls-panel">
            <div class="panel-header">ĐUA NGỰA</div>

            <a href="../index.html" class="btn-nav">⬅ QUAY VỀ MENU</a>

            <div class="prize-card">
                <div class="prize-name" id="prize-name">ĐANG TẢI...</div>
                <div class="prize-count" id="prize-count">---</div>
            </div>

            <div class="settings-form">
                <div class="input-group">
                    <label>CHỌN QUÀ</label>
                    <select id="inp-prize"
                        style="width: 120px; padding: 5px; border-radius: 6px; border: 1px solid var(--glass-border); background: rgba(0, 0, 0, 0.4); color: var(--tet-gold); font-weight: bold;">
                        <option value="-1">---</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Số lượng ngựa (Max 500)</label>
                    <input type="number" id="inp-qty" value="10" min="2" max="500">
                </div>
                <div class="input-group">
                    <label>THỜI GIAN (s)</label>
                    <input type="number" id="inp-time" value="30" min="10" max="600">
                </div>
            </div>

            <div class="timer-display" id="timer">00:00.0</div>

            <!-- Removed loading-status as requested -->

            <button class="btn-action btn-start" id="btn-start" onclick="startGame()" disabled>🏁 BẮT ĐẦU</button>
            <button class="btn-action btn-reset" id="btn-reset" onclick="resetGame()">🔄 LÀM MỚI</button>
        </div>

        <!-- RIGHT PANEL: GAME STAGE -->
        <div class="game-stage" id="gameStage">
            <!-- Clouds removed for performance -->

            <div id="sinkhole-alert">⚠️ CẢNH BÁO!<br>HỐ TỬ THẦN!</div>

            <div class="rank-board">
                <div class="rank-title">BẢNG XẾP HẠNG</div>
                <div id="rank-list">---</div>
            </div>

            <div id="winner-screen">
                <div class="win-box">
                    <div class="trophy-icon">🏆</div>
                    <h2 class="win-title">NHÀ VÔ ĐỊCH</h2>
                    <div class="win-img-container">
                        <img id="win-img" src="" style="width: 100%; height: 100%; object-fit: contain;">
                    </div>
                    <h1 id="win-name" class="win-name">#1</h1>
                    <button id="btn-replay" onclick="resetGame()">Đua Ván Mới</button>
                </div>
            </div>

            <div id="horse-layer"></div>
            <canvas id="gameCanvas"></canvas>

            <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
            <script>
                const HORSE_GIF_FILE = 'horse.gif';

                let gifImage = new Image();
                function preloadGif() {
                    gifImage.src = HORSE_GIF_FILE;
                    gifImage.onload = () => {
                        // document.getElementById('loading-status').innerText = "✅ Sẵn Sàng!";
                        // document.getElementById('loading-status').style.background = "#4caf50";
                        document.getElementById('btn-start').disabled = false;
                    };
                    gifImage.onerror = () => { alert(`Lỗi: Không tìm thấy file "${HORSE_GIF_FILE}"!`); };
                }
                preloadGif();

                const FUNNY_MESSAGES = {
                    FENCE: ["Ui da!", "Đau cái đầu!", "Cụng đầu!", "U đầu!", "Mẻ trán!", "Ai chắn đường?", "Ối giời ơi!"],
                    MUD: ["Dính phốt!", "Bẩn quá!", "Lầy quá!", "Huhu!", "Mắc kẹt!", "Nặng mông!", "Ai đổ bùn vậy?"],
                    SPIKE: ["Thủng chân!", "Á đau quá!", "Chảy máu rồi!", "Gai nhọn!", "Thủng lốp!", "Ối á!", "Nhảy lò cò!"],
                    HOLE: ["Cứu bé với!", "Rớt hố rồi!", "Bye bye!", "Lọt hố!", "Aaaaaaa!", "Toang rồi!", "Ét ô ét!"],
                    NITRO: ["Xé gió!", "Vụt bay!", "Tăng tốc!", "Quá nhanh!", "Bám đuôi nhé!"]
                };

                function getRandomMessage(type) {
                    let list = FUNNY_MESSAGES[type] || ["Á đù!"];
                    return list[Math.floor(Math.random() * list.length)];
                }

                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                function playSound(type) {
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    const now = audioCtx.currentTime;

                    if (type === 'gallop') {
                        osc.type = 'triangle'; osc.frequency.setValueAtTime(120, now); osc.frequency.exponentialRampToValueAtTime(60, now + 0.1);
                        gain.gain.setValueAtTime(0.02, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                        osc.start(now); osc.stop(now + 0.1);
                    } else if (type === 'win') {
                        osc.type = 'square'; osc.frequency.setValueAtTime(523.25, now);
                        gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 1.5);
                        osc.start(now); osc.stop(now + 1.5);
                    } else if (type === 'alert') {
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(600, now);
                        osc.frequency.linearRampToValueAtTime(400, now + 0.5);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.linearRampToValueAtTime(0, now + 0.5);
                        osc.start(now); osc.stop(now + 0.5);
                    } else if (type === 'crash') {
                        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now); osc.frequency.linearRampToValueAtTime(50, now + 0.3);
                        gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
                        osc.start(now); osc.stop(now + 0.3);
                    } else if (type === 'fall') {
                        osc.type = 'sine'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.8);
                        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0, now + 0.8);
                        osc.start(now); osc.stop(now + 0.8);
                    }
                }

                // --- GAME LOGIC CLASS (Simulation - Based on User Prompt) ---
                class RaceLogic {
                    constructor(duration, distance, horses) {
                        this.distance = distance;
                        this.horses = horses;
                        this.isFinished = false;

                        // Calibrate speed to match roughly the requested duration
                        // distance (px) / duration (s) / 60 (fps) = pixels per frame
                        let targetAvgSpeed = distance / (duration * 60);

                        this.minSpeed = targetAvgSpeed * 0.5;
                        this.maxSpeed = targetAvgSpeed * 1.5;
                        this.boostSpeed = this.maxSpeed * 1.5;

                        // Initialize horses
                        this.horses.forEach(h => {
                            h.velocity = this.minSpeed + Math.random() * (this.maxSpeed - this.minSpeed);
                            h.acceleration = 0;
                        });
                    }

                    start() {
                        this.startTime = performance.now() / 1000;
                    }

                    update() {
                        if (this.isFinished) return true;

                        for (let h of this.horses) {
                            // 1. Random Acceleration (small changes per frame)
                            // Random between -0.05 and +0.05
                            let acc = (Math.random() - 0.5) * 0.1;

                            // 2. Update Speed
                            h.velocity += acc;

                            // 3. Clamp Speed
                            h.velocity = Math.max(this.minSpeed, Math.min(h.velocity, this.maxSpeed));

                            // 4. Boost Logic (>= 70% distance)
                            // Small chance (e.g., 0.5% per frame) to get a burst
                            if (h.x >= this.distance * 0.7) {
                                if (Math.random() < 0.005) {
                                    h.velocity += 2; // Sudden burst
                                    // Allow exceeding maxSpeed slightly for the boost effect
                                }
                            }

                            // 5. Update Position
                            h.x += h.velocity;

                            // Gallop Animation (Bobbing Y based on speed)
                            h.yOffset = Math.sin(Date.now() / (200 / h.velocity)) * 3;

                            // 6. Check Finish
                            if (h.x >= this.distance) {
                                h.rank = 1; // First one is rank 1
                                this.isFinished = true;
                                return true; // Stop loop immediately as per requirement
                            }
                        }

                        // Sort for leaderboard (visual only, doesn't affect logic)
                        // We can do this in the main loop less frequently

                        return false;
                    }
                }

                const canvas = document.getElementById('gameCanvas');
                const ctx = canvas.getContext('2d');
                const horseLayer = document.getElementById('horse-layer');
                const gameStage = document.getElementById('gameStage');

                let width = gameStage.offsetWidth, height = gameStage.offsetHeight;
                canvas.width = width; canvas.height = height;
                window.addEventListener('resize', () => {
                    width = gameStage.offsetWidth; height = gameStage.offsetHeight;
                    canvas.width = width; canvas.height = height;
                });

                const START_LINE = 200;
                const MAP_LENGTH = 10000; // Fixed long distance
                const FINISH_LINE = MAP_LENGTH;

                // [MOD] MỞ RỘNG ĐƯỜNG ĐUA: Giảm lề trên dưới
                const TOP_MARGIN = 60;
                const BOTTOM_MARGIN = 20;

                // PRIZE SYSTEM
                let prizes = [];
                let currentPrizeIndex = -1;

                let horses = [];
                let postFinishTrees = [];
                let raceLogic = null;
                let raceDuration = 30;

                // --- LOAD PRIZE ---
                window.addEventListener('DOMContentLoaded', () => {
                    loadCurrentPrize();
                });

                function loadCurrentPrize() {
                    const storedPrizes = localStorage.getItem('lucky_draw_prizes');
                    if (storedPrizes) {
                        prizes = JSON.parse(storedPrizes);
                        currentPrizeIndex = prizes.findIndex(p => p.quantity > 0);
                        updatePrizeUI();
                    }
                }

                function updatePrizeUI() {
                    const nameEl = document.getElementById('prize-name');
                    const countEl = document.getElementById('prize-count');
                    const startBtn = document.getElementById('btn-start');

                    if (currentPrizeIndex !== -1) {
                        const p = prizes[currentPrizeIndex];
                        nameEl.innerText = p.name;
                        countEl.innerText = `Còn lại: ${p.quantity}`;
                        if (gifImage.complete) startBtn.disabled = false;
                    } else {
                        nameEl.innerText = "HẾT QUÀ";
                        countEl.innerText = "Vui lòng nạp thêm";
                        startBtn.disabled = true;
                    }
                }

                let isRacing = false;
                let startTime = 0;
                let cameraX = 0;
                let globalFrame = 0;

                let sinkholeTimer = 0;
                let nextSinkholeTime = 0;
                let sinkholeCount = 0;
                let maxSinkholes = 3;

                const JOCKEY_COLORS = ['#f44336', '#e91e63', '#9c27b0', '#2196f3', '#009688', '#ffeb3b', '#ff5722'];

                const HORSE_FILTERS = [
                    'none', 'hue-rotate(45deg) saturate(1.5)', 'hue-rotate(90deg) saturate(1.5)',
                    'hue-rotate(135deg) saturate(1.5)', 'hue-rotate(180deg) saturate(1.5)',
                    'hue-rotate(225deg) saturate(1.5)', 'hue-rotate(270deg) saturate(1.5)',
                    'hue-rotate(315deg) saturate(1.5)', 'grayscale(100%)', 'invert(100%)', 'sepia(100%) saturate(2)'
                ];

                const OBS_TYPES = {
                    MUD: { type: 'zone', shape: 'circle', color: 'rgba(93, 64, 55, 0.9)', radius: 55, speedMod: 0.3, name: 'Vũng Bùn' },
                    SPIKE: { type: 'item', shape: 'circle', radius: 25, stunTime: 120, name: 'Bẫy Gai' },
                    HOLE: { type: 'trap', shape: 'circle', color: '#000000', radius: 45, name: 'Hố Tử Thần' },
                    // [MOD] NITRO RỘNG & DÀI HƠN NỮA: 300x120
                    NITRO_PAD: { type: 'boost', shape: 'rect', width: 300, height: 120, name: 'Tăng Tốc' }
                };

                function loop() {
                    requestAnimationFrame(loop);
                    if (!isRacing && horses.length === 0) { drawBackground(0); return; }

                    let currentTime = performance.now() / 1000;
                    let isFinished = false;

                    if (isRacing && raceLogic) {
                        isFinished = raceLogic.update(); // No arguments needed for simulation logic

                        // Update Timer
                        let elapsed = currentTime - raceLogic.startTime;
                        // Since duration is variable, we just show elapsed time
                        let secs = Math.floor(elapsed);
                        let ms = Math.floor((elapsed - secs) * 10);
                        document.getElementById('timer').innerText = `00:${secs.toString().padStart(2, '0')}.${ms}`;
                    }

                    // Camera Logic
                    let leaderX = 0;
                    if (horses.length > 0) leaderX = Math.max(...horses.map(h => h.x));

                    let targetCam = leaderX - width / 3;
                    targetCam = Math.max(0, targetCam);
                    cameraX += (targetCam - cameraX) * 0.1; // Smoother camera

                    let renderCamX = cameraX;
                    let renderCamY = 0;

                    // Draw Background
                    ctx.clearRect(0, 0, width, height);
                    ctx.save(); ctx.translate(0, renderCamY); drawBackground(renderCamX); ctx.restore();

                    // Update Horses DOM
                    let viewMinX = renderCamX - 100;
                    let viewMaxX = renderCamX + width + 100;

                    horses.forEach(h => {
                        // Culling
                        if (h.x > viewMinX && h.x < viewMaxX) {
                            let screenX = h.x - renderCamX;
                            let screenY = h.y + h.yOffset + renderCamY;

                            h.domElement.style.display = 'block';
                            h.domElement.style.transform = `translate3d(${screenX - 60}px, ${screenY - 50}px, 0)`;
                            h.domElement.style.zIndex = Math.floor(screenY);
                        } else {
                            h.domElement.style.display = 'none';
                        }
                    });

                    // Rank Board Update (Throttled)
                    if (isRacing && Math.floor(currentTime * 60) % 30 === 0) {
                        updateRankBoard();
                    }

                    // Check Finish
                    if (isRacing && isFinished) {
                        let winner = horses.find(h => h.rank === 1);
                        if (winner) endGame(winner);
                    }
                }

                function spawnRandomSinkhole(leaderX) {
                    let alertBox = document.getElementById('sinkhole-alert');
                    alertBox.classList.add('show');
                    playSound('alert');

                    setTimeout(() => {
                        alertBox.classList.remove('show');
                    }, 2000);

                    let spawnX = leaderX + width + Math.random() * 300;

                    let safeYMin = TOP_MARGIN + 50;
                    let safeYMax = height - BOTTOM_MARGIN - 50;
                    let spawnY = safeYMin + Math.random() * (safeYMax - safeYMin);

                    let obs = {
                        x: spawnX,
                        y: spawnY,
                        config: OBS_TYPES.HOLE,
                        typeKey: 'HOLE',
                        rotation: 0
                    };

                    obstacles.push(obs);
                }

                function drawBackground(camX) {
                    let trackY = TOP_MARGIN;
                    let trackH = height - TOP_MARGIN - BOTTOM_MARGIN;

                    // Draw Grass (Full Screen)
                    ctx.fillStyle = "#4CAF50";
                    ctx.fillRect(0, 0, width, height);

                    // Draw Track (Dirt) - Full Width
                    ctx.fillStyle = "#795548";
                    ctx.fillRect(0, trackY, width, trackH);

                    // Draw Dirt Details
                    ctx.fillStyle = "rgba(0,0,0,0.1)";
                    let density = 10;
                    let startCol = Math.floor(camX / density);
                    let endCol = startCol + (width / density) + 2;
                    for (let i = startCol; i < endCol; i++) {
                        for (let j = 0; j < trackH / density; j++) {
                            let seed = Math.sin(i * 12.9898 + j * 78.233) * 43758.5453;
                            let rand = seed - Math.floor(seed);
                            let drawX = (i * density) - camX;
                            let drawY = trackY + (j * density);
                            if (drawX < width && rand > 0.7) ctx.fillRect(drawX, drawY, 4, 4);
                        }
                    }

                    drawContinuousFences(camX, width);
                    drawDecorations(camX, width);

                    // Draw Post-Finish Trees
                    postFinishTrees.forEach(tree => {
                        let treeScreenX = tree.x - camX;
                        if (treeScreenX > -100 && treeScreenX < width + 100) {
                            drawSimpleTree(treeScreenX, tree.y, tree.radius, tree.color);
                        }
                    });

                    drawLines(camX, trackY, trackH);
                }



                function drawContinuousFences(camX, visibleWidth) {
                    drawWoodFence(camX, TOP_MARGIN - 20, visibleWidth);
                    drawWoodFence(camX, height - BOTTOM_MARGIN, visibleWidth);
                }

                function drawWoodFence(camX, y, width) {
                    ctx.fillStyle = "#5D4037";
                    ctx.fillRect(0, y + 5, width, 5); ctx.fillRect(0, y + 15, width, 5);
                    let startX = -(camX % 60);
                    for (let i = startX; i < width; i += 60) {
                        ctx.fillRect(i, y, 8, 25);
                        ctx.fillStyle = "#4E342E"; ctx.fillRect(i - 1, y - 2, 10, 4); ctx.fillStyle = "#5D4037";
                    }
                }

                function drawDecorations(camX, visibleWidth) {
                    let startX = -(camX % 150);
                    for (let i = startX; i < visibleWidth; i += 150) {
                        if (i % 300 === 0) drawHayBale(i, TOP_MARGIN - 45); else drawTireStack(i, TOP_MARGIN - 40);
                    }
                    for (let i = startX + 75; i < visibleWidth; i += 150) {
                        if (i % 300 === 0) drawHayBale(i, height - BOTTOM_MARGIN + 5); else drawTireStack(i, height - BOTTOM_MARGIN + 10);
                    }
                }

                function drawHayBale(x, y) {
                    ctx.save(); ctx.translate(x, y);
                    ctx.fillStyle = "#FFD54F"; ctx.fillRect(0, 0, 30, 20);
                    ctx.strokeStyle = "#FFB300"; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(10, 20); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(20, 0); ctx.lineTo(20, 20); ctx.stroke();
                    ctx.restore();
                }

                function drawTireStack(x, y) {
                    ctx.save(); ctx.translate(x, y);
                    ctx.fillStyle = "#333"; ctx.beginPath(); ctx.arc(10, 10, 10, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = "#444"; ctx.beginPath(); ctx.arc(12, 8, 10, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = "#222"; ctx.beginPath(); ctx.arc(12, 8, 4, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                }

                function drawSimpleTree(x, y, radius, color) {
                    ctx.save(); ctx.translate(x, y);
                    ctx.fillStyle = "#5D4037"; ctx.fillRect(-radius / 4, 0, radius / 2, radius / 2);
                    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(0, -radius / 2, radius, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = "rgba(0,0,0,0.2)"; ctx.beginPath(); ctx.ellipse(0, radius / 2 - 5, radius, radius / 3, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                }

                function drawLines(camX, y, h) {
                    let sx = START_LINE - camX;
                    if (sx > -100 && sx < width) {
                        let startW = 30;
                        ctx.fillStyle = "#fff"; ctx.fillRect(sx - startW, y, startW, h);
                        ctx.fillStyle = "#000"; for (let row = y; row < y + h; row += 20) { if ((row / 20) % 2 === 0) ctx.fillRect(sx - startW, row, startW / 2, 20); else ctx.fillRect(sx - startW + startW / 2, row, startW / 2, 20); }
                        ctx.fillStyle = "#FFF"; ctx.font = "bold 22px 'Roboto Condensed'"; ctx.textAlign = "right"; ctx.fillText("START", sx - startW - 10, y + 30);
                    }

                    if (isFinishLineSpawned) {
                        let fx = FINISH_LINE - camX;
                        if (fx < width && fx > -100) {
                            let finishW = 30;
                            ctx.fillStyle = "#fff"; ctx.fillRect(fx, y, finishW, h);
                            ctx.fillStyle = "#000"; for (let row = y; row < y + h; row += 20) { if ((row / 20) % 2 === 0) ctx.fillRect(fx, row, finishW / 2, 20); else ctx.fillRect(fx + finishW / 2, row, finishW / 2, 20); }
                            ctx.fillStyle = "#FFF"; ctx.font = "bold 20px 'Roboto Condensed'"; ctx.textAlign = "center"; ctx.fillText("FINISH", fx + finishW + 35, y + 30);
                        }
                    }
                }

                function showComment(horse, text) {
                    let bubble = document.createElement('div');
                    bubble.className = 'chat-bubble';
                    bubble.innerText = text;
                    horse.domElement.appendChild(bubble);
                    setTimeout(() => { bubble.remove(); }, 2000);
                }

                function generateObstacles(trackHeight) {
                    obstacles = [];
                    // [MOD] REMOVED ALL TRAPS AS REQUESTED
                }

                function startGame() {
                    if (currentPrizeIndex === -1 || !prizes[currentPrizeIndex]) { alert("Vui lòng chọn giải thưởng!"); return; }
                    if (prizes[currentPrizeIndex].quantity <= 0) { alert("Giải này đã hết!"); updatePrizeUI(); return; }
                    if (isRacing) return;

                    // Update dimensions
                    width = gameStage.offsetWidth;
                    height = gameStage.offsetHeight;
                    canvas.width = width; canvas.height = height;

                    let qtyInput = document.getElementById('inp-qty');
                    let qty = parseInt(qtyInput.value);
                    if (isNaN(qty) || qty < 2) qty = 10;
                    if (qty > 500) qty = 500;

                    console.log("Starting race with QTY:", qty);

                    let timeInput = document.getElementById('inp-time');
                    let timeSec = parseInt(timeInput.value);
                    if (isNaN(timeSec) || timeSec < 10) timeSec = 30;
                    raceDuration = timeSec;

                    // Load Participants
                    let participants = [];
                    const storedParticipants = localStorage.getItem('lucky_draw_participants');
                    if (storedParticipants) {
                        try {
                            participants = JSON.parse(storedParticipants);
                        } catch (e) { console.error("Error parsing participants", e); }
                    }

                    // If no participants, generate dummy ones
                    if (!participants || participants.length === 0) {
                        console.warn("No participants found, generating dummies.");
                        participants = Array.from({ length: qty }, (_, k) => ({ name: `Horse ${k + 1}`, id: `${k + 1}` }));
                    }

                    // Shuffle Participants
                    for (let i = participants.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [participants[i], participants[j]] = [participants[j], participants[i]];
                    }

                    // Prepare Horses
                    horses = [];
                    horseLayer.innerHTML = '';

                    // Generate Ranks (1 to qty)
                    let ranks = Array.from({ length: qty }, (_, i) => i + 1);
                    // Shuffle Ranks
                    for (let i = ranks.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [ranks[i], ranks[j]] = [ranks[j], ranks[i]];
                    }

                    let availableHeight = height - TOP_MARGIN - BOTTOM_MARGIN - 40;
                    if (availableHeight < 100) availableHeight = 100;

                    for (let i = 0; i < qty; i++) {
                        let p = participants[i % participants.length];
                        if (!p) p = { name: `Horse ${i + 1}`, id: `${i + 1}` }; // Fallback safety

                        // Distribute evenly from top to bottom
                        let progress = i / Math.max(qty - 1, 1);
                        let y = TOP_MARGIN + (progress * availableHeight);

                        // Add small random jitter
                        y += (Math.random() - 0.5) * 10;

                        // Create DOM
                        let wrapper = document.createElement('div');
                        wrapper.className = 'horse-wrapper';
                        let img = document.createElement('img');
                        img.src = HORSE_GIF_FILE;

                        // Filter
                        let horseFilter = HORSE_FILTERS[Math.floor(Math.random() * HORSE_FILTERS.length)];
                        img.style.filter = horseFilter + " drop-shadow(0 10px 5px rgba(0, 0, 0, 0.3))";

                        let saddleTxt = document.createElement('div');
                        saddleTxt.className = 'saddle-number';
                        // Use Employee Name if available, otherwise ID, otherwise 1-based index
                        let displayId = p.name ? p.name : (p.id ? p.id : (i + 1));
                        saddleTxt.innerText = displayId;

                        wrapper.appendChild(img);
                        wrapper.appendChild(saddleTxt);
                        horseLayer.appendChild(wrapper);

                        // Set initial position immediately
                        wrapper.style.transform = `translate3d(${START_LINE - 60}px, ${y - 50}px, 0)`;
                        wrapper.style.zIndex = Math.floor(y);

                        let jColor = JOCKEY_COLORS[i % JOCKEY_COLORS.length];

                        horses.push({
                            id: displayId,
                            x: START_LINE,
                            y: y,
                            yOffset: 0,
                            rank: ranks[i],
                            randomSeed: Math.random() * 1000,
                            domElement: wrapper,
                            jockeyColor: jColor,
                            data: p,
                            realName: p.name,
                            msnv: p.id,
                            originalFilter: horseFilter
                        });
                    }

                    // Initialize Logic
                    raceLogic = new RaceLogic(raceDuration, MAP_LENGTH - 600, horses);
                    raceLogic.start();

                    isRacing = true;
                    startTime = Date.now();

                    document.getElementById('btn-start').disabled = true;
                    document.getElementById('btn-reset').disabled = true;
                    document.getElementById('winner-screen').style.display = 'none';
                    document.getElementById('rank-list').innerHTML = '---';

                    playSound('gallop');
                    requestAnimationFrame(loop);
                }

                function resetGame() {
                    isRacing = false;
                    horses = [];
                    horseLayer.innerHTML = '';
                    postFinishTrees = [];
                    document.getElementById('winner-screen').style.opacity = '0';
                    setTimeout(() => { document.getElementById('winner-screen').style.display = 'none'; }, 500);
                    document.getElementById('timer').innerText = "00:00.0";
                    document.getElementById('sinkhole-alert').classList.remove('show');

                    document.getElementById('btn-start').disabled = false;
                    document.getElementById('btn-reset').disabled = false;

                    drawBackground(0);
                }

                function endGame(winner) {
                    isRacing = false;
                    playSound('win');
                    let ws = document.getElementById('winner-screen');
                    ws.style.display = 'flex';
                    setTimeout(() => { ws.style.opacity = '1'; }, 50);
                    document.getElementById('win-name').innerText = winner.realName || ("NGỰA SỐ " + winner.id);
                    document.getElementById('win-name').style.color = winner.jockeyColor;
                    let winImg = document.getElementById('win-img');
                    winImg.src = HORSE_GIF_FILE;
                    winImg.style.filter = winner.originalFilter;
                    confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });

                    // --- CẬP NHẬT KHO QUÀ ---
                    let prizeName = "Vô Địch";
                    let prizeItem = "";

                    if (currentPrizeIndex !== -1) {
                        const p = prizes[currentPrizeIndex];
                        prizeName = p.name;
                        prizeItem = p.item;

                        prizes[currentPrizeIndex].quantity--;
                        localStorage.setItem('lucky_draw_prizes', JSON.stringify(prizes));
                        updatePrizeUI();
                    }

                    // --- LƯU NGƯỜI THẮNG VÀO HỆ THỐNG ---
                    saveWinnerToSystem({
                        name: winner.realName || ("Ngựa Số " + winner.id),
                        id: winner.msnv || "",
                        prize: prizeName,
                        prizeItem: prizeItem,
                        timestamp: Date.now(),
                        gameType: "Đua Ngựa"
                    });
                }

                function saveWinnerToSystem(winnerData) {
                    let winners = JSON.parse(localStorage.getItem('lucky_draw_winners') || '[]');
                    winners.push(winnerData);
                    localStorage.setItem('lucky_draw_winners', JSON.stringify(winners));
                    console.log("Saved winner:", winnerData);
                }

                function updateTimer() {
                    let d = Date.now() - startTime;
                    let m = Math.floor(d / 60000);
                    let s = Math.floor((d / 1000) % 60);
                    let ms = Math.floor((d % 1000) / 100);
                    document.getElementById('timer').innerText = `${m}:${s < 10 ? '0' + s : s}.${ms}`;
                }

                function updateRankBoard() {
                    // Sort by X position (descending)
                    let sorted = [...horses].sort((a, b) => b.x - a.x);

                    let html = '';
                    // Only show top 5
                    sorted.slice(0, 5).forEach((h, index) => {
                        let rankClass = '';
                        if (index === 0) rankClass = 'color: #FFD700; font-weight:900; font-size:1.1em;';
                        else if (index === 1) rankClass = 'color: #C0C0C0; font-weight:bold;';
                        else if (index === 2) rankClass = 'color: #cd7f32; font-weight:bold;';

                        html += `
                        <div class="r-item" style="${rankClass}">
                            <div><span class="r-badge" style="background:${h.jockeyColor}"></span> #${h.id}</div>
                        </div>
                        `;
                    });
                    document.getElementById('rank-list').innerHTML = html;
                }

                drawBackground(0);
            </script>
        </div>
    </div>
</body>

</html>
