                if (savedWinners) document.getElementById('inp-winners').value = savedWinners;
            } catch (e) { }
            updateModeUI();
            // Load Participants Count
            const storedParticipants = localStorage.getItem('lucky_draw_participants');
            if (storedParticipants) {
                try {
                    const parts = JSON.parse(storedParticipants);
                    const qtyInput = document.getElementById('inp-qty');
                    if (qtyInput && parts.length > 0) {
                        qtyInput.value = parts.length;
                    }
                } catch (e) {
                    console.error("Error loading participants for count:", e);
                }
            }
            requestAnimationFrame(loop);
        });

        function loadPrizesAndPopulateDropdown() {
            const storedPrizes = localStorage.getItem('lucky_draw_prizes');
            const prizeSelect = document.getElementById('inp-prize');
            prizeSelect.innerHTML = ""; // Clear existing options

            if (storedPrizes) {
                prizes = JSON.parse(storedPrizes);

                // Populate Dropdown
                prizes.forEach((p, index) => {
                    let option = document.createElement('option');
                    option.value = index;
                    option.text = `${p.name} (${p.quantity})`;
                    if (p.quantity <= 0) option.disabled = true;
                    prizeSelect.appendChild(option);
                });

                // Select first available prize
                currentPrizeIndex = prizes.findIndex(p => p.quantity > 0);
                if (currentPrizeIndex !== -1) {
                    prizeSelect.value = currentPrizeIndex;
                }

                updatePrizeUI();
            }

            // Add Event Listener for Dropdown Change
            prizeSelect.addEventListener('change', (e) => {
                currentPrizeIndex = parseInt(e.target.value);
                updatePrizeUI();
            });
        }

        function updatePrizeUI() {
            const nameEl = document.getElementById('prize-name');
            const countEl = document.getElementById('prize-count');
            const startBtn = document.getElementById('btn-start');
            const prizeSelect = document.getElementById('inp-prize');

            if (currentPrizeIndex !== -1 && prizes[currentPrizeIndex]) {
                const p = prizes[currentPrizeIndex];
                nameEl.innerText = p.name;
                countEl.innerText = `Còn lại: ${p.quantity}`;
                startBtn.style.opacity = "1";
                startBtn.style.pointerEvents = "auto";

                // Sync dropdown if changed externally (though mainly internal)
                prizeSelect.value = currentPrizeIndex;
            } else {
                nameEl.innerText = "HẾT QUÀ";
                countEl.innerText = "Vui lòng nạp thêm";
                startBtn.style.opacity = "0.5";
                startBtn.style.pointerEvents = "none";
            }
        }

        // --- GAME LOGIC CLASS (Deterministic) ---
        class RaceLogic {
            constructor(duration, distance, ducks) {
                this.duration = duration;
                this.distance = distance;
                this.ducks = ducks;
                this.startTime = 0;
                this.lastTime = 0;
            }

            start() {
                this.startTime = performance.now() / 1000;
                this.lastTime = this.startTime;
            }

            update(currentTime) {
                let dt = currentTime - this.lastTime;
                this.lastTime = currentTime;
                let elapsed = currentTime - this.startTime;
                let t = elapsed / this.duration;
                let clampedT = Math.min(Math.max(t, 0), 1);

                let baseX = clampedT * this.distance;

                this.ducks.forEach(d => {
                    // Initialize state flags
                    if (!d.stuckTime) d.stuckTime = 0;
                    if (!d.stunTimer) d.stunTimer = 0;
                    if (!d.collisionCooldown) d.collisionCooldown = 0; // New cooldown
                    const stuckBefore = d.stuckTime;

                    // Handle Stun Timer
                    if (d.stunTimer > 0) {
                        d.stunTimer -= dt;
                        d.stuckTime += dt; // Time effectively stops
                        // NO SLIDING OR MOVEMENT HERE - Fixes "dịch chuyển" bug
                    } else if (d.collisionCooldown > 0) {
                        d.collisionCooldown -= dt;
                    }

                    // Collision Detection with Logs
                    let isColliding = false;

                    // Only check if not already finished
                    if (d.x < FINISH_LINE) {
                        for (let log of logs) {
                            // Hitbox for VERTICAL LOGS (Rotation ~90deg)
                            let logHalfThick = log.height / 2 + 5;
                            let logHalfLen = log.width / 2 + 5;
                            let inX = Math.abs(d.x - log.x) < (logHalfThick + 10);
                            let inY = Math.abs(d.y - log.y) < (logHalfLen + 5);

                            if (inX && inY) {
                                isColliding = true;
                                break;
                            }
                        }
                    }

                    if (isColliding) {
                        // NEW STUN LOGIC with COOLDOWN
                        // Only stun if not already stunned AND cooldown is over
                        if (d.stunTimer <= 0 && d.collisionCooldown <= 0) {
                            d.stunTimer = 0.5;          // Light stun (0.5s)
                            d.collisionCooldown = 2.5;  // Quick recovery
                        }

                        // Escape Logic (Slide) - ONLY if not stunned (i.e., dragging past)
                        // This pushes them out AFTER the stun finishes
                        if (d.stunTimer <= 0) {
                            d.stuckTime += dt * 0.5; // Slow down while squeezing past

                            let nearLog = logs.find(l => Math.abs(d.x - l.x) < 50 && Math.abs(d.y - l.y) < 150);
                            if (nearLog) {
                                if (d.y < nearLog.y) d.initY -= 0.5; // Stronger push to Ensure escape
                                else d.initY += 0.5;
                            } else {
                                d.initY += (Math.random() - 0.5) * 1.0;
                            }
                        }
                    }

                    // Collision with Lotus Leaves (Traps)
                    // Effect: "Gựng lại" -> Temporary slowdown
                    d.inLotus = false;
                    if (d.x < FINISH_LINE) {
                        for (let leaf of lotusLeaves) {
                            let dx = d.x - leaf.x;
                            let dy = d.y - leaf.y;
                            // Circular collision
                            if (dx * dx + dy * dy < (leaf.radius + 15) * (leaf.radius + 15)) {
                                d.stuckTime += dt * 0.6; // 60% slowdown penalty
                                d.inLotus = true;
                            }
                        }
                    }

                    // Các hình phạt cộng dồn không được vượt quá thời gian trôi qua, nếu không vịt bị kéo lùi
                    if (d.stuckTime - stuckBefore > dt) d.stuckTime = stuckBefore + dt;

                    // Calculate effective time for this duck
                    let effectiveElapsed = Math.max(0, elapsed - d.stuckTime);

                    let duckT = effectiveElapsed / this.duration;
                    let clampedDuckT = Math.min(Math.max(duckT, 0), 1);

                    // Re-calculate BaseX using duck-specific time
                    // Không chặn ở t = 1: sau mốc thời gian vịt vẫn bơi tiếp, nếu không vịt xếp thấp bị kẹt trước vạch và dao động tới lui
                    let baseX = Math.max(duckT, 0) * this.distance;

                    // Noise & Variation Logic
                    let frequency = 0.5 + (d.randomSeed % 10) / 10;
                    let amplitude = this.distance * (0.005 + (d.randomSeed % 10) / 1000);
                    // Dao động tăng dần từ 0 trong 4 giây đầu: tất cả vịt xuất phát thẳng hàng rồi mới tách nhau
                    let noiseX = Math.sin(effectiveElapsed * frequency + d.randomSeed) * amplitude * Math.min(1, effectiveElapsed / 4);

                    // Rank Bias
                    let biasX = 0;
                    let rankFactor = (this.ducks.length - d.rank) / this.ducks.length;
                    if (d.rank === 1) biasX = (this.distance * 0.03) * (clampedDuckT * clampedDuckT);
                    else if (d.rank === this.ducks.length) biasX = -(this.distance * 0.03) * (clampedDuckT * clampedDuckT);
                    else biasX = (this.distance * 0.015) * (rankFactor - 0.5) * (clampedDuckT * clampedDuckT);

                    // START SPRINT LOGIC
                    // Ducks with startBoost gain extra distance for the first few seconds
                    let sprintBias = 0;
                    if (d.startBoost) {
                        // Calculate how much time they have spent boosting
                        let boostTime = Math.min(effectiveElapsed, d.boostDuration);
                        // Add extra distance
                        sprintBias = boostTime * d.boostStrength;
                    }

                    let finalX = baseX + noiseX + biasX + sprintBias;
                    // if (clampedDuckT >= 1) finalX = Math.min(finalX, this.distance); // REMOVED to allow crossing
                    finalX = Math.max(0, finalX);

                    d.x = START_LINE + finalX;
                    d.effElapsed = effectiveElapsed;

                    // Physics (Y-axis)
                    let bobOffset = Math.sin(effectiveElapsed * d.bobSpeed + d.bobPhase) * d.bobAmplitude;
                    d.y = d.initY + bobOffset; // Note: d.initY might be modified by collision slide

                    // STRICT BOUNDARY CHECK: Keep ducks in the river
                    // River top is BANK_HEIGHT. River bottom is height.
                    // Add a small margin (e.g., 10px) so they don't clip into the bank or edge
                    let minY = BANK_HEIGHT + 15;
                    let maxY = height - 15;

                    if (d.y < minY) {
                        d.y = minY;
                        d.initY = minY - bobOffset; // Update initY so they don't snap back next frame
                    } else if (d.y > maxY) {
                        d.y = maxY;
                        d.initY = maxY - bobOffset;
                    }

                    let tilt = Math.cos(effectiveElapsed * d.bobSpeed + d.bobPhase) * 0.1;
                    d.rotation = tilt;
                });

                // Finish when leading duck crosses the finish line width (visually past it)
                let leaderX = 0;
                for (const d of this.ducks) if (d.x > leaderX) leaderX = d.x;
                this.leaderX = leaderX;
                const finishX = START_LINE + this.distance + 50; // +50 for visual clearance
                if (winnersNeeded <= 1) return leaderX >= finishX;
                if (leaderX < finishX) return false;
                // Nhiều người thắng: kết thúc khi đủ N vịt đã qua vạch (dự phòng: quá giờ 15 giây)
                if (elapsed > this.duration + 15) return true;
                let crossed = 0;
                for (const d of this.ducks) if (d.x >= finishX) crossed++;
                return crossed >= winnersNeeded;
            }
        }

        // --- MAIN FUNCTIONS ---
        // Vòng tròn (x, y, r) có đè lên khúc gỗ, lá sen hoặc hoa sen đã đặt không
        function overlapsScenery(x, y, r) {
            for (const l of logs) {
                const ex = Math.cos(l.rotation) * l.width / 2, ey = Math.sin(l.rotation) * l.width / 2;
                const dx = ex * 2, dy = ey * 2;
                const t = Math.max(0, Math.min(1, ((x - (l.x - ex)) * dx + (y - (l.y - ey)) * dy) / (dx * dx + dy * dy)));
                if (Math.hypot(x - (l.x - ex + dx * t), y - (l.y - ey + dy * t)) < r + l.height / 2 + 14) return true;
            }
            for (const f of lotusLeaves) if (Math.hypot(x - f.x, y - f.y) < r + f.radius + 12) return true;
            for (const f of lotusFlowers) if (Math.hypot(x - f.x, y - f.y) < r + f.radius + 12) return true;
            return false;
        }

        function startGame() {
            // Reload prizes to ensure fresh data
            const storedPrizes = localStorage.getItem('lucky_draw_prizes');
            if (storedPrizes) prizes = JSON.parse(storedPrizes);

            // Get selected prize from dropdown
            const prizeSelect = document.getElementById('inp-prize');
            currentPrizeIndex = parseInt(prizeSelect.value);

            if (currentPrizeIndex === -1 || !prizes[currentPrizeIndex]) {
                alert("Vui lòng chọn giải thưởng!");
                return;
            }

            if (prizes[currentPrizeIndex].quantity <= 0) {
                alert("Giải này đã hết!");
                updatePrizeUI();
                return;
            }

            if (isRacing || countingDown) return;

            // Auto-hide panel-inner (Controls Panel)
            document.querySelector('.controls-panel').style.display = 'none';

            // Update dimensions for full screen
            resizeCanvas();
            envCached = false;

            // Setup Ducks
            ducks = [];
            let qtyInput = document.getElementById('inp-qty');
            let qty = parseInt(qtyInput.value);
            if (isNaN(qty) || qty < 2) qty = 30;
            console.log("Starting race with QTY:", qty);

            const multiMode = document.getElementById('inp-mode').value === 'multi';
            const winnersInput = document.getElementById('inp-winners').value;
            winnersNeeded = multiMode ? Math.max(2, Math.min(50, parseInt(winnersInput) || 5)) : 1;
            try {
                localStorage.setItem('duck_v2_mode', multiMode ? 'multi' : 'one');
                localStorage.setItem('duck_v2_winners', multiMode ? winnersNeeded : (winnersInput || 5));
            } catch (e) { }

            raceDuration = 30; // Hardcoded 30s as requested
            winnerId = Math.floor(Math.random() * qty) + 1;

            // Calculate Lanes
            let availableHeight = height - BANK_HEIGHT - 40;
            let laneHeight = availableHeight / qty;

            // Generate Ranks
            let ranks = Array.from({
                length: qty
            }, (_, i) => i + 1);

            // Shuffle
            for (let i = ranks.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [ranks[i], ranks[j]] = [ranks[j], ranks[i]];
            }

            // Ensure Winner gets Rank 1
            let rank1Idx = ranks.indexOf(1);
            let winnerIdx = winnerId - 1;

            if (rank1Idx !== -1) {
                ranks[rank1Idx] = ranks[winnerIdx];
                ranks[winnerIdx] = 1;
            }

            // Generate Logs (Obstacles)
            logs = [];
            let numLogs = Math.floor(TRACK_LENGTH / 300); // 1 log every 300px roughly
            for (let i = 0; i < numLogs; i++) {
                logs.push({
                    x: START_LINE + 500 + Math.random() * (TRACK_LENGTH - 1000),
                    y: BANK_HEIGHT + 20 + Math.random() * availableHeight,
                    width: 120 + Math.random() * 80, // Much longer: 120-200px
                    height: 24, // Fixed thickness for cylinder look
                    rotation: Math.PI / 2 + (Math.random() - 0.5) * 0.4, // Rotate ~90 degrees to lie across the river
                    moss: Math.random() > 0.5, // 50% chance of moss
                    grain: Array.from({ length: 3 }, () => [Math.random() - 0.5, Math.random() - 0.5]) // vân gỗ cố định
                });
            }

            // Generate Lotus Leaves (Traps)
            // They slow ducks down significantly ("gựng lại")
            lotusLeaves = [];
            lotusFlowers = [];
            let numLotus = Math.floor(TRACK_LENGTH / 400); // 1 patch every 400px
            for (let i = 0; i < numLotus; i++) {
                const radius = 25 + Math.random() * 15; // 25-40px radius
                for (let attempt = 0; attempt < 30; attempt++) {
                    const x = START_LINE + 200 + Math.random() * (TRACK_LENGTH - 500);
                    const y = BANK_HEIGHT + 20 + Math.random() * availableHeight;
                    if (overlapsScenery(x, y, radius)) continue;
                    lotusLeaves.push({ x, y, radius, rotation: Math.random() * Math.PI * 2 });
                    break;
                }
            }

            // Hoa sen trang trí: đặt ở chỗ trống, không đè lên lá sen hay khúc gỗ
            let numFlowers = Math.floor(TRACK_LENGTH / 350);
            for (let i = 0; i < numFlowers; i++) {
                const radius = 13 + Math.random() * 5;
                for (let attempt = 0; attempt < 30; attempt++) {
                    const x = START_LINE + 150 + Math.random() * (TRACK_LENGTH - 300);
                    const y = BANK_HEIGHT + 20 + Math.random() * availableHeight;
                    if (overlapsScenery(x, y, radius)) continue;
                    lotusFlowers.push({ x, y, radius, rotation: Math.random() * Math.PI });
                    break;
                }
            }

            // --- LOAD PARTICIPANTS ---
            const storedParticipants = localStorage.getItem('lucky_draw_participants');
            let participants = [];
            if (storedParticipants) {
                try {
                    participants = JSON.parse(storedParticipants);

                    // --- FILTER OUT WINNERS ---
                    const storedWinners = JSON.parse(localStorage.getItem('lucky_draw_winners') || '[]');
                    const winnerIds = new Set(storedWinners.map(w => w.id ? String(w.id).trim() : null).filter(x => x));

                    participants = participants.filter(p => {
                        let pId = p.id || p.msnv || p.code || p.employeeCode || p.ma_nv || null;
                        pId = pId ? String(pId).trim() : null;

                        if (pId && winnerIds.has(pId)) return false;
                        return true;
                    });
                    // --------------------------

                    // Shuffle participants
                    for (let i = participants.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [participants[i], participants[j]] = [participants[j], participants[i]];
                    }

                    // --- ADJUST QUANTITY TO MATCH AVAILABLE PARTICIPANTS ---
                    if (participants.length > 0) {
                        if (participants.length < qty) {
                            console.log(`Requested ${qty} ducks but only ${participants.length} eligible participants found. Adjusting qty.`);
                            qty = participants.length;
                        }
                    } else {
                        console.warn("No eligible participants found! Using placeholders.");
                    }
                    // -----------------------------------------------------

                } catch (e) { console.error(e); }
            }

            winnersNeeded = Math.min(winnersNeeded, qty);

            for (let i = 0; i < qty; i++) {
                let p = participants[i] || {};
                // Robust data mapping
                let pName = p.name || p.fullName || p.hoTen || p.ho_ten || `Vịt #${i + 1}`;
                // Fallback for ID: if missing, use i+1 but clearer
                let pId = p.id || p.msnv || p.code || p.employeeCode || p.ma_nv || `D${i + 1}`;

                ducks.push({
                    id: i + 1,
                    realName: pName,
                    msnv: pId,
                    initY: BANK_HEIGHT + 20 + (i * laneHeight),
                    rank: ranks[i],
                    randomSeed: Math.floor(Math.random() * 10000),
                    hue: 0,
                    // Hat removed
                    x: START_LINE,
                    y: BANK_HEIGHT + 20 + (i * laneHeight),
                    // Physics Props - SWIMMING
                    bobSpeed: 3 + Math.random() * 4, // Speed of bobbing
                    bobPhase: Math.random() * Math.PI * 2, // Random starting phase
                    bobAmplitude: 2 + Math.random() * 3, // Height of bobbing
                    rotation: 0,
                    // SPRINT ABILITY
                    startBoost: Math.random() < 0.2, // 20% chance to have a start boost
                    boostDuration: 3 + Math.random() * 3, // Boost lasts 3-6 seconds
                    boostStrength: 40 + Math.random() * 40 // Extra pixels per second (FAST!)
                });
            }

            // UI Reset
            document.getElementById('winner-screen').style.display = 'none';
            const alertBox = document.getElementById('scenario-alert');
            alertBox.style.transform = "translateX(-50%) scale(1)";

            setTimeout(() => {
                alertBox.style.transform = "translateX(-50%) scale(0)";
            }, 3000);

            // Vịt vào vị trí xuất phát, đếm ngược 3-2-1 rồi tất cả cùng chạy
            rankedNow = [];
            needsRedraw = true;
            runCountdown(() => {
                raceLogic = new RaceLogic(raceDuration, TRACK_LENGTH, ducks);
                raceLogic.start();
                isRacing = true;
            });
        }

        // Đếm ngược 3-2-1-XUẤT PHÁT!
        function runCountdown(onGo) {
            countingDown = true;
            const el = document.getElementById('countdown');
            const steps = ['3', '2', '1', 'XUẤT PHÁT!'];
            steps.forEach((txt, i) => setTimeout(() => {
                el.textContent = txt;
                el.classList.toggle('go', i === steps.length - 1);
                el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
                if (i < steps.length - 1) {
                    playSound('beep');
                } else {
                    playSound('go');
                    countingDown = false;
                    onGo();
                }
            }, 700 + i * 900));
        }

        // Xóa cache kết quả: xóa lịch sử trúng giải + đưa người đã trúng về lại danh sách tham gia (danh sách quà giữ nguyên)
        // Trả về số người được đưa về; -1 nếu bấm Hủy; -2 nếu chưa có ai trúng giải
        function restoreWinnersToParticipants() {
            let winners = [], participants = [];
            try { winners = JSON.parse(localStorage.getItem('lucky_draw_winners') || '[]'); } catch (e) { }
            try { participants = JSON.parse(localStorage.getItem('lucky_draw_participants') || '[]'); } catch (e) { }
            if (!Array.isArray(winners)) winners = [];
            if (!Array.isArray(participants)) participants = [];
            if (winners.length === 0) return -2;
            if (!confirm(`Xóa lịch sử ${winners.length} lượt trúng giải và đưa người đã trúng trở lại danh sách tham gia?\n(Danh sách quà giữ nguyên)`)) return -1;

            const norm = v => String(v || '').trim();
            const ids = new Set(participants.map(p => norm(p.id)).filter(Boolean));
            const names = new Set(participants.map(p => norm(p.name)).filter(Boolean));
            let restored = 0;
            winners.forEach(w => {
                let name = norm(w.name), id = norm(w.id);
                // Có game lưu ngược Tên/Mã NV (giống xử lý ở trang Kết Quả): tên bắt đầu bằng YEG => đảo lại
                if (name.toUpperCase().startsWith('YEG')) [name, id] = [id, name];
                // Ngựa/Vịt không gắn người tham gia (VD "Ngựa 7", "Vịt #3") => bỏ qua
                if (!id && /^(Ngựa |Vịt #)\d+$/.test(name)) return;
                if (!name && !id) return;
                if (id ? ids.has(id) : names.has(name)) return; // đã có trong danh sách
                participants.push({ stt: participants.length + 1, name, id });
                if (id) ids.add(id);
                if (name) names.add(name);
                restored++;
            });
            localStorage.setItem('lucky_draw_participants', JSON.stringify(participants));
            localStorage.removeItem('lucky_draw_winners');
            return restored;
        }

        function clearWinnersCache() {
            if (isRacing || countingDown) return;
            const restored = restoreWinnersToParticipants();
            if (restored === -2) { alert('Chưa có lịch sử trúng giải nào để xóa.'); return; }
            if (restored < 0) return;
            alert(`Đã xóa cache kết quả, đưa ${restored} người về lại danh sách tham gia.`);
            location.reload(); // cập nhật lại số vịt theo danh sách mới
        }

        function resetGame() {
            // Force reload to refresh participant list and clear state completely
            location.reload();
        }

        function finishGame() {
            isRacing = false;
            // playSound('fireworks_start'); // REMOVED per user request

            // Find Top 1
            let sortedDucks = [...ducks].sort((a, b) => b.x - a.x); // Sort by position (Visual Winner)
            let topWinners = sortedDucks.slice(0, winnersNeeded);

            // UI Update
            document.getElementById('winner-screen').style.display = 'flex';

            let prizeName = "Vô Địch";
            let prizeItem = "";
            let prizesToAward = 0;

            if (currentPrizeIndex !== -1 && prizes[currentPrizeIndex]) {
                const p = prizes[currentPrizeIndex];
                prizeName = p.name;
                prizeItem = p.item;

                // Tất cả người thắng cùng nhận giải đang chọn
                prizesToAward = topWinners.length;

                // Deduct quantity
                // prizes[currentPrizeIndex].quantity -= prizesToAward;
                // localStorage.setItem('lucky_draw_prizes', JSON.stringify(prizes));
                updatePrizeUI();
            }

            // Render Winner Grid
            let listHtml = "";
            let winnersHistory = JSON.parse(localStorage.getItem('lucky_draw_winners') || '[]');
            const savedAt = Date.now();

            topWinners.forEach((d, index) => {
                let rank = index + 1;
                let rankClass = `rank-${rank}`;

                // Determine if this duck gets a prize (Logic for history)
                let hasPrize = index < prizesToAward;
                // Visual Update: Always show prize name as requested by USER
                let pName = prizeName;

                // Create Canvas ID
                let canvasId = `win-canvas-${d.id}`;

                let prizeImgHtml = "";
                if (hasPrize && currentPrizeIndex !== -1 && prizes[currentPrizeIndex] && prizes[currentPrizeIndex].image) {
                    prizeImgHtml = `<img src="${prizes[currentPrizeIndex].image}" style="width: 80px; height: 80px; object-fit: contain; margin: 5px auto; display: block;">`;
                }

                listHtml += `
                    <div class="winner-box ${rankClass}">
                        <div class="w-rank-badge">#${rank}</div>
                        <canvas id="${canvasId}" width="300" height="300"></canvas>
                        <div class="w-prize-tag" style="color: #d32f2f; font-size: 1.6rem; margin-bottom: 2px;">${pName}</div>
                        <div class="w-name-tag" style="font-size: 2.2rem; color: #000; line-height: 1.2; margin: 4px 0;">${d.realName || ("Vịt #" + d.id)}</div>
                        <div class="w-id-tag" style="font-size: 1.6rem; color: #333; font-weight: bold; background: #f0f0f0; padding: 6px 16px; border-radius: 12px; display: inline-block; margin-top: 4px;">ID: ${d.msnv || "---"}</div>
                    </div>
                `;

                // Save History if they got a prize
                if (hasPrize) {
                    winnersHistory.push({
                        name: d.realName || ("Vịt #" + d.id),
                        id: d.msnv || "",
                        prize: prizeName,
                        prizeItem: prizeItem,
                        timestamp: savedAt,
                        gameType: "Đua Vịt Tet V2"
                    });
                }
            });

            localStorage.setItem('lucky_draw_winners', JSON.stringify(winnersHistory));

            // --- REMOVE WINNER FROM PARTICIPANTS LIST ---
            try {
                let currentParticipants = JSON.parse(localStorage.getItem('lucky_draw_participants') || '[]');
                let initialCount = currentParticipants.length;

                // Get IDs of winners (usually only 1)
                let len = topWinners.length;
                let winnerIds = topWinners.map(d => String(d.msnv || d.id).trim());
                let winnerNames = topWinners.map(d => String(d.realName || d.name || "").trim());

                // Filter
                currentParticipants = currentParticipants.filter(p => {
                    let pId = String(p.id || p.msnv || p.code || p.employeeCode || "").trim();
                    let pName = String(p.name || "").trim();

                    // Check against any of the winners
                    let match = false;
                    for (let i = 0; i < len; i++) {
                        let wID = winnerIds[i];
                        let wName = winnerNames[i];

                        if (wID && pId && wID === pId) { match = true; break; }
                        if ((!wID || !pId) && wName && pName === wName) { match = true; break; }
                    }
                    return !match;
                });

                if (currentParticipants.length !== initialCount) {
                    localStorage.setItem('lucky_draw_participants', JSON.stringify(currentParticipants));
                    console.log("Removed winners from list:", winnerIds);
                }
            } catch (e) {
                console.error("Error removing winner from list:", e);
            }

            const winnerGrid = document.getElementById('top-5-container');
            winnerGrid.classList.toggle('compact', topWinners.length > 2);
            winnerGrid.innerHTML = listHtml;

            // Draw Avatars after HTML injection
            topWinners.forEach(d => {
                let canvasId = `win-canvas-${d.id}`;
                drawDuckAvatar(canvasId, d);
            });

            // Effects
            confetti({
                particleCount: 200,
                spread: 100,
                origin: {
                    y: 0.6
                }
            });
        }

        // --- RENDERING ---
        function loop() {
            if (!isRacing && !needsRedraw) { requestAnimationFrame(loop); return; }
            needsRedraw = false;
            globalTimer += 0.05;

            if (isRacing && raceLogic) {
                let now = performance.now() / 1000;
                let isFinished = raceLogic.update(now);
                rankedNow = [...ducks].sort((a, b) => b.x - a.x);
                updateCamera();

                let elapsedMS = (now - raceLogic.startTime) * 1000;
                updateTimerUI(elapsedMS);

                // Throttle Rank UI updates (every 500ms) to prevent jank
                if (now - lastRankUpdate > 0.5) {
                    updateRankUI();
                    lastRankUpdate = now;
                }

                if (isFinished) finishGame();
            }

            // Draw Frame
            ctx.clearRect(0, 0, width, height);
            // drawWater(); // Handled by CSS

            ctx.save();
            ctx.translate(-cameraX, 0);
            drawEnvironment(cameraX);
            drawStartFinish(cameraX);
            drawLotusLeaves(); // Draw traps under ducks
            drawLotusFlowers();
            drawLogs();
            drawDucks();
            ctx.restore();
            drawHUD();

            requestAnimationFrame(loop);
        }

        // Thanh tiến độ cuộc đua (trên cùng) + bộ đếm "đã về đích / cần lấy"
        function drawPin(cx, cy, color) {
            ctx.fillStyle = color; ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.arc(cx, cy - 4, 9, Math.PI * 0.85, Math.PI * 2.15); ctx.lineTo(cx, cy + 12); ctx.closePath();
            ctx.fill(); ctx.stroke();
            ctx.fillStyle = color === "#FFFFFF" ? "#90A4AE" : "#FFFFFF";
            ctx.beginPath(); ctx.arc(cx, cy - 4, 3.5, 0, Math.PI * 2); ctx.fill();
        }

        function drawHUD() {
            const x0 = 48, x1 = width - 48, y = 12, h = 18, mid = y + h / 2;
            toonRect(x0 - 6, y - 5, x1 - x0 + 12, h + 10, 10, "#1565A8", 3);
            const segW = (x1 - x0) / 10;
            for (let i = 0; i < 10; i++) {
                ctx.fillStyle = i % 2 ? "#81D4FA" : "#B3E5FC";
                ctx.fillRect(x0 + i * segW + 1.5, y, segW - 3, h);
            }
            drawPin(x0 - 24, mid, "#FFFFFF");
            drawPin(x1 + 24, mid, "#FF5252");

            if (ducks.length) {
                const px = d => x0 + (x1 - x0) * Math.max(0, Math.min(1, (d.x - START_LINE) / TRACK_LENGTH));
                ctx.strokeStyle = INK; ctx.lineWidth = 1.5;
                ducks.forEach(d => {
                    ctx.fillStyle = DUCK_COLOR;
                    ctx.beginPath(); ctx.arc(px(d), mid, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                });
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                for (let i = Math.min(3, rankedNow.length) - 1; i >= 0; i--) {
                    const bx = px(rankedNow[i]);
                    ctx.fillStyle = ["#FFD54F", "#E0E0E0", "#FFAB91"][i]; ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
                    ctx.beginPath(); ctx.arc(bx, mid, 12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = INK; ctx.font = `800 14px ${TOON_FONT}`; ctx.fillText(i + 1, bx, mid + 1);
                }
            }

            // Bộ đếm kiểu "6/16": số vịt đã qua vạch / số cần lấy (hộp ngay trên bảng xếp hạng)
            const finishX = START_LINE + TRACK_LENGTH + 50;
            const done = String(ducks.filter(d => d.x >= finishX).length), need = "/" + winnersNeeded;
            const bx0 = width - 216, bw = 196, by0 = 44, bh = 46;
            ctx.fillStyle = "rgba(33, 33, 33, 0.9)"; ctx.strokeStyle = "rgba(255, 255, 255, 0.85)"; ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.roundRect(bx0, by0, bw, bh, 14); ctx.fill(); ctx.stroke();
            ctx.fillStyle = "#FFFFFF"; ctx.font = `800 15px ${TOON_FONT}`;
            ctx.textAlign = "left"; ctx.textBaseline = "middle";
            ctx.fillText("🏁 VỀ ĐÍCH", bx0 + 14, by0 + bh / 2 + 1);
            ctx.textBaseline = "alphabetic"; ctx.lineJoin = "round";
            ctx.font = `800 24px ${TOON_FONT}`; const wNeed = ctx.measureText(need).width;
            ctx.font = `800 36px ${TOON_FONT}`; const wDone = ctx.measureText(done).width;
            const rx = bx0 + bw - 14, by = by0 + bh - 9;
            ctx.lineWidth = 5; ctx.strokeStyle = INK;
            ctx.strokeText(done, rx - wNeed - wDone, by); ctx.fillStyle = "#FF9800"; ctx.fillText(done, rx - wNeed - wDone, by);
            ctx.font = `800 24px ${TOON_FONT}`; ctx.lineWidth = 4;
            ctx.strokeText(need, rx - wNeed, by); ctx.fillStyle = "#FFFFFF"; ctx.fillText(need, rx - wNeed, by);
        }

        function updateCamera() {
            let maxX = (ducks.length > 0 && raceLogic) ? raceLogic.leaderX : 0;
            let targetCam = maxX - (width * 0.5); // Keep leader at 50% width (Centered)
            targetCam = Math.max(0, Math.min(targetCam, MAP_LENGTH - width));
            cameraX += (targetCam - cameraX) * 0.1;
        }

        function updateTimerUI(elapsed) {
            let ms = Math.floor((elapsed % 1000) / 100);
            let s = Math.floor((elapsed / 1000) % 60);
            let m = Math.floor(elapsed / 60000);
            if (timerElement) {
                const text = (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s) + "." + ms;
                if (text !== lastTimerText) { lastTimerText = text; timerElement.innerText = text; }
            }
        }

        function updateRankUI() {
            let sorted = [...ducks].sort((a, b) => b.x - a.x);
            sorted.forEach((d, i) => { d.place = i + 1; });
            let html = "";

            for (let i = 0; i < Math.min(5, sorted.length); i++) {
                html += `<div class="rank-item"><span class="${i === 0 ? 'rank-1' : ''}">#${sorted[i].msnv || sorted[i].id}</span></div>`;
            }

            document.getElementById('rank-list').innerHTML = html;
        }

        function drawEnvironment(camX) {
            const H = BANK_HEIGHT;
            const viewX = Math.floor(camX) - 1, viewW = width + 2;

            // 1. Dải trời + hàng bụi cây xa (cuộn chậm hơn để có chiều sâu)
            ctx.fillStyle = "#CDEEFF";
            ctx.fillRect(viewX, 0, viewW, 40);
            ctx.fillStyle = "#35BE9E";
            ctx.beginPath();
            for (let x = Math.floor((camX * 0.7 - 60) / 70) * 70; x < camX * 0.7 + width + 60; x += 70) {
                const cx = x + camX * 0.3;
                ctx.moveTo(cx + 34, 62); ctx.arc(cx, 62, 34, 0, Math.PI, true);
            }
            ctx.fill();
            ctx.fillStyle = "#21A587";
            ctx.fillRect(viewX, 56, viewW, 24);

            // 2. Cỏ sọc thẳng trên bờ
            ctx.fillStyle = "#6CC85A";
            ctx.fillRect(viewX, 74, viewW, H - 74);
            ctx.fillStyle = "#5DBB4C";
            ctx.beginPath();
            for (let x = Math.floor(camX / 180) * 180; x < camX + width; x += 180) ctx.rect(x, 74, 90, H - 74);
            ctx.fill();

            // 3. Khóm cỏ nhỏ
            ctx.strokeStyle = "rgba(46, 125, 50, 0.45)";
            ctx.lineWidth = 2; ctx.lineCap = "round";
            ctx.beginPath();
            for (let gx = Math.floor(camX / 90) * 90; gx < camX + width + 90; gx += 90) {
                const hh = Math.abs(Math.sin(gx * 12.9898) * 43758.5453) % 1;
                const tx = gx + hh * 70, ty = 96 + hh * 14;
                ctx.moveTo(tx - 5, ty - 6); ctx.lineTo(tx - 2, ty);
                ctx.moveTo(tx, ty - 9); ctx.lineTo(tx, ty);
                ctx.moveTo(tx + 5, ty - 6); ctx.lineTo(tx + 2, ty);
            }
            ctx.stroke();

            // 4. Cây tròn viền đậm trên bờ
            ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.lineJoin = "round";
            for (let i = 50 + Math.max(0, Math.floor((camX - 300) / 200)) * 200; i < MAP_LENGTH && i - camX < width + 200; i += 200) {
                if (i - camX <= -200) continue;
                ctx.fillStyle = "#A1887F";
                ctx.beginPath(); ctx.roundRect(i - 6, H - 52, 12, 44, 3); ctx.fill(); ctx.stroke();
                ctx.fillStyle = "#43B44F";
                ctx.beginPath(); ctx.arc(i, H - 76, 26, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(i - 20, H - 60, 17, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(i + 20, H - 60, 17, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.fillStyle = "#43B44F";
                ctx.beginPath(); ctx.arc(i, H - 70, 24, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = "#7BD66A";
                ctx.beginPath(); ctx.arc(i - 8, H - 82, 10, 0, Math.PI * 2); ctx.fill();
            }

            // 5. Mép bờ: viền đậm + bọt nước trắng
            ctx.fillStyle = "#4BA83C";
            ctx.fillRect(viewX, H - 12, viewW, 12);
            ctx.strokeStyle = INK; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(viewX, H); ctx.lineTo(viewX + viewW, H); ctx.stroke();
            ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
            ctx.beginPath();
            for (let x = Math.floor(camX / 34) * 34; x < camX + width + 34; x += 34) {
                ctx.moveTo(x + 9, H + 6); ctx.arc(x, H + 6, 9, 0, Math.PI * 2);
            }
            ctx.fill();

            // 6. Gợn sóng trên mặt nước
            ctx.strokeStyle = "rgba(255, 255, 255, 0.5)"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
            ctx.beginPath();
            for (let gx = Math.floor(camX / 150) * 150; gx < camX + width + 150; gx += 150) {
                for (let gy = H + 50; gy < height; gy += 80) {
                    const hh = Math.abs(Math.sin(gx * 12.9898 + gy * 78.233) * 43758.5453) % 1;
                    const tx = gx + hh * 120, ty = gy + hh * 40;
                    ctx.moveTo(tx - 15, ty); ctx.quadraticCurveTo(tx - 7, ty - 6, tx, ty); ctx.quadraticCurveTo(tx + 7, ty + 6, tx + 15, ty);
                }
            }
            ctx.stroke();

            // 7. Cột mốc khoảng cách (mỗi 100m tính từ vạch xuất phát)
            for (let k = 1; k * 1000 < TRACK_LENGTH; k++) {
                const x = START_LINE + k * 1000;
                if (x - camX < -100 || x - camX > width + 100) continue;
                ctx.strokeStyle = "rgba(255, 255, 255, 0.45)"; ctx.lineWidth = 3; ctx.setLineDash([14, 12]);
                ctx.beginPath(); ctx.moveTo(x, H + 28); ctx.lineTo(x, height); ctx.stroke();
                ctx.setLineDash([]);
                toonRect(x - 30, H + 12, 60, 26, 13, "#FFF59D");
                ctx.fillStyle = INK; ctx.font = `800 15px ${TOON_FONT}`;
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(k * 100 + "m", x, H + 26);
            }
        }

        // Cổng xuất phát / về đích: dải caro, hai cột sọc đỏ trắng viền đậm và biển tên phía trên bờ
        function drawGate(x, stripW, label, bannerColor, textColor) {
            const cell = stripW / 2, poleW = 10;
            const signTop = BANK_HEIGHT - 84, signH = 34;
            const cx = x + stripW / 2;

            // Dải caro vắt ngang sông
            ctx.fillStyle = "#FFFFFF";
            ctx.fillRect(x, BANK_HEIGHT, stripW, height - BANK_HEIGHT);
            ctx.fillStyle = INK;
            ctx.beginPath();
            for (let r = 0, y = BANK_HEIGHT; y < height; r++, y += cell) {
                ctx.rect(r % 2 === 0 ? x + cell : x, y, cell, Math.min(cell, height - y));
            }
            ctx.fill();
            ctx.strokeStyle = INK; ctx.lineWidth = 3;
            ctx.strokeRect(x, BANK_HEIGHT, stripW, height - BANK_HEIGHT);

            // Hai cột sọc đỏ trắng, cao lên khỏi bờ để treo biển
            for (const px of [x - poleW, x + stripW]) {
                ctx.fillStyle = "#FFFFFF";
                ctx.fillRect(px, signTop, poleW, height - signTop);
                ctx.fillStyle = "#FF5252";
                ctx.beginPath();
                for (let y = signTop; y < height; y += 24) ctx.rect(px, y, poleW, Math.min(12, height - y));
                ctx.fill();
                ctx.strokeStyle = INK; ctx.lineWidth = 3;
                ctx.strokeRect(px, signTop, poleW, height - signTop);
            }

            // Biển tên kiểu truyện tranh
            const signW = Math.max(100, stripW + poleW * 2 + 12);
            toonRect(cx - signW / 2, signTop, signW, signH, 12, bannerColor, 3);
            toonText(label, cx, signTop + signH / 2 + 1, 19, textColor);
        }

        function drawStartFinish(camX) {
            const startX = START_LINE + 28; // sát mũi vịt khi đứng ở vạch xuất phát
            if (startX - camX > -150 && startX - camX < width + 150) {
                drawGate(startX, 16, "START", "#4FC3F7", "#FFFFFF");
            }
            const finishX = FINISH_LINE + 10;
            if (finishX - camX > -150 && finishX - camX < width + 150) {
                drawGate(finishX, 40, "FINISH", "#FF5252", "#FFEB3B");
                // Dây cờ đuôi nheo trên cổng đích
                const flagColors = ["#FFD54F", "#4FC3F7", "#FF8A80", "#AED581"];
                const y0 = BANK_HEIGHT - 44;
                ctx.strokeStyle = INK; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(finishX - 10, y0); ctx.lineTo(finishX + 50, y0); ctx.stroke();
                for (let i = 0; i < 4; i++) {
                    const fx = finishX - 6 + i * 14;
                    ctx.fillStyle = flagColors[i];
                    ctx.beginPath(); ctx.moveTo(fx, y0); ctx.lineTo(fx + 12, y0); ctx.lineTo(fx + 6, y0 + 13); ctx.closePath();
                    ctx.fill(); ctx.stroke();
                }
            }
        }

        function drawLogs() {
            logs.forEach(log => {
                if (log.x - cameraX > -100 && log.x - cameraX < width + 100) {
                    ctx.save();
                    ctx.translate(log.x, log.y);
                    ctx.rotate(log.rotation);

                    const rw = log.width / 2;
                    const rh = log.height / 2;

                    // Bóng + vòng nước quanh khúc gỗ
                    ctx.fillStyle = "rgba(0, 40, 90, 0.2)";
                    ctx.beginPath(); ctx.ellipse(0, 6, rw + 3, rh + 2, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.6)"; ctx.lineWidth = 2.5;
                    ctx.beginPath(); ctx.ellipse(0, 3, rw + 9, rh + 7, 0, 0, Math.PI * 2); ctx.stroke();

                    // Thân gỗ
                    ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.fillStyle = "#B08968";
                    ctx.beginPath(); ctx.roundRect(-rw, -rh, rw * 2, rh * 2, rh * 0.8); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = "rgba(255, 224, 178, 0.45)"; // vệt sáng trên thân
                    ctx.beginPath(); ctx.roundRect(-rw + 8, -rh + 3, rw * 2 - 16, 5, 2.5); ctx.fill();

                    // Vân gỗ cố định
                    ctx.strokeStyle = "#7B5236"; ctx.lineWidth = 2; ctx.lineCap = "round";
                    ctx.beginPath();
                    for (const g of log.grain) {
                        const yOff = g[0] * rh * 1.2 + 2;
                        ctx.moveTo(-rw + 14, yOff);
                        ctx.lineTo(rw - 14, yOff + g[1] * 4);
                    }
                    ctx.stroke();

                    // Hai đầu gỗ có vòng tuổi
                    ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.fillStyle = "#FFE0B2";
                    for (const ex of [-rw + 6, rw - 6]) {
                        ctx.beginPath(); ctx.ellipse(ex, 0, 5, rh - 3, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                        ctx.strokeStyle = "#BCAAA4"; ctx.lineWidth = 1.5;
                        ctx.beginPath(); ctx.ellipse(ex, 0, 2, (rh - 3) * 0.5, 0, 0, Math.PI * 2); ctx.stroke();
                        ctx.strokeStyle = INK; ctx.lineWidth = 2.5;
                    }

                    // Rêu
                    if (log.moss) {
                        ctx.fillStyle = "#7CB342"; ctx.strokeStyle = INK; ctx.lineWidth = 2;
                        ctx.beginPath(); ctx.arc(-rw * 0.3, -rh + 2, 7, Math.PI, 0); ctx.arc(-rw * 0.3 + 11, -rh + 3, 5, Math.PI, 0);
                        ctx.fill(); ctx.stroke();
                    }

                    ctx.restore();
                }
            });
        }

        function drawLotusLeaves() {
            lotusLeaves.forEach(leaf => {
                if (leaf.x - cameraX > -100 && leaf.x - cameraX < width + 100) {
                    ctx.save();
                    ctx.translate(leaf.x, leaf.y);
                    ctx.rotate(leaf.rotation);

                    // Lá sen (hình khuyết) viền đậm
                    ctx.fillStyle = "#7ED957"; ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineJoin = "round";
                    ctx.beginPath();
                    ctx.arc(0, 0, leaf.radius, 0.2, Math.PI * 2 - 0.2);
                    ctx.lineTo(0, 0);
                    ctx.closePath();
                    ctx.fill(); ctx.stroke();

                    // Gân lá
                    ctx.strokeStyle = "#B7F0A0"; ctx.lineWidth = 2; ctx.lineCap = "round";
                    ctx.beginPath();
                    for (let i = 0; i < 5; i++) {
                        const angle = 0.5 + (Math.PI * 2 - 1) * i / 4;
                        ctx.moveTo(0, 0);
                        ctx.lineTo(Math.cos(angle) * (leaf.radius - 5), Math.sin(angle) * (leaf.radius - 5));
                    }
                    ctx.stroke();

                    ctx.restore();
                }
            });
        }

        // Hoa sen nổi riêng trên mặt nước (không nằm đè lên lá sen hay khúc gỗ)
        function drawLotusFlowers() {
            lotusFlowers.forEach(f => {
                if (f.x - cameraX > -60 && f.x - cameraX < width + 60) {
                    ctx.save();
                    ctx.translate(f.x, f.y);
                    ctx.strokeStyle = "rgba(255, 255, 255, 0.6)"; ctx.lineWidth = 2.5;
                    ctx.beginPath(); ctx.ellipse(0, 4, f.radius + 6, f.radius * 0.55 + 4, 0, 0, Math.PI * 2); ctx.stroke();
                    ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.lineJoin = "round";
                    ctx.fillStyle = "#FF8FB1";
                    for (let i = 0; i < 6; i++) {
                        const a = (Math.PI * 2 * i) / 6 + f.rotation;
                        ctx.save();
                        ctx.rotate(a);
                        ctx.beginPath(); ctx.ellipse(f.radius * 0.5, 0, f.radius * 0.55, f.radius * 0.3, 0, 0, Math.PI * 2);
                        ctx.fill(); ctx.stroke();
                        ctx.restore();
                    }
                    ctx.fillStyle = "#FFEB3B";
                    ctx.beginPath(); ctx.arc(0, 0, f.radius * 0.3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                    ctx.restore();
                }
            });
        }

        // Emoji được vẽ sẵn thành ảnh nhỏ một lần rồi dùng lại, tránh vẽ chữ emoji mỗi khung hình
        const emojiCache = {};
        function emojiSprite(ch, px) {
            const key = ch + px;
            let c = emojiCache[key];
            if (!c) {
                c = emojiCache[key] = document.createElement('canvas');
                c.width = c.height = px * 2;
                const g = c.getContext('2d');
                g.scale(2, 2);
                g.font = `${px * 0.85}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
                g.textAlign = "center";
                g.textBaseline = "middle";
                g.fillText(ch, px / 2, px / 2 + 1);
            }
            return c;
        }

        function duckEmotion(d) {
            if (!isRacing) return d.x >= START_LINE + TRACK_LENGTH + 50 ? '🥳' : null;
            if (d.stunTimer > 0) return '💫';
            if (d.inLotus) return '😰';
            if (d.startBoost && d.effElapsed < d.boostDuration) return '🔥';
            // Dẫn đầu / bét bảng chỉ có ý nghĩa khi cuộc đua đã đi được một đoạn
            const progress = raceLogic ? (raceLogic.leaderX - START_LINE) / TRACK_LENGTH : 0;
            if (progress < 0.15 || ducks.length < 2) return null;
            if (d.place === 1) return '😎';
            if (d.place === ducks.length) return '😢';
            return null;
        }

        const WAKE_COLORS = Array.from({ length: 10 }, (_, i) => `rgba(220, 245, 255, ${0.7 - (i * 0.07)})`);

        function drawDucks() {
            ducks.forEach(d => {
                let sx = d.x;

                if (sx - cameraX > -100 && sx - cameraX < width + 100) {
                    ctx.save();
                    ctx.translate(sx, d.y);
                    ctx.rotate(d.rotation || 0);

                    // Improved Water Splash & Wake
                    if (isRacing) {
                        // 1. Main Water Line / Contact Patch (Pulsing Ripple)
                        let pulse = Math.sin(globalTimer * 10 + d.randomSeed) * 2;
                        ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
                        ctx.beginPath();
                        ctx.ellipse(-5, 18, 28 + pulse, 6, 0, 0, Math.PI * 2);
                        ctx.fill();

                        // 2. Trailing Wake (Particles)
                        for (let i = 0; i < 10; i++) {
                            let t = globalTimer * 12 + i + d.randomSeed;

                            // Trail goes behind (negative X)
                            // Start near tail (-20) and go back
                            let xOff = -25 - (i * 4) + Math.cos(t) * 2;
                            let yOff = 18 + Math.sin(t * 1.5) * 3;

                            let size = 2.5 + Math.sin(t) * 1;
                            ctx.fillStyle = WAKE_COLORS[i];
                            ctx.beginPath();
                            ctx.arc(xOff, yOff, size, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }

                    // 1. Draw Duck Image
                    if (duckImage.complete) {
                        ctx.drawImage(duckImage, -25, -25, 50, 50);
                    } else {
                        // Fallback circle if not loaded
                        ctx.fillStyle = "#ffeb3b";
                        ctx.beginPath();
                        ctx.arc(0, 0, 15, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // 5. Bong bóng biểu cảm phía sau đầu vịt: chỉ hiện khi vịt đang ở tình huống đặc biệt
                    const emotion = duckEmotion(d);
                    if (emotion) {
                        ctx.fillStyle = "rgba(255, 255, 255, 0.92)";
                        ctx.strokeStyle = "rgba(0, 0, 0, 0.25)";
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();
                        ctx.arc(-18, -34, 12, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                        ctx.drawImage(emojiSprite(emotion, 16), -26, -42, 16, 16);
                    }

                    // 6. ID Tag
                    // Show MSNV if available, otherwise just ID
                    let displayText = d.msnv || d.id;

                    // Adjust box size based on text length
                    ctx.font = `800 11px ${TOON_FONT}`;
                    if (d.labelW === undefined) d.labelW = Math.max(22, ctx.measureText(displayText).width + 14);
                    let boxWidth = d.labelW;

                    toonRect(-34 - boxWidth / 2, -8, boxWidth, 16, 8, "#FFFFFF", 2);
                    ctx.fillStyle = INK;
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText(displayText, -34, 1);

                    // 7. Stun Effect (Spinning Stars)
                    if (d.stunTimer && d.stunTimer > 0) {
                        ctx.save();
                        // Position above head
                        ctx.translate(0, -35);
                        // Spin based on time
                        ctx.rotate(globalTimer * 2);

                        // Draw Cluster of stars
                        for (let k = 0; k < 3; k++) {
                            ctx.rotate((Math.PI * 2) / 3);
                            ctx.fillStyle = "#FFD700"; // Gold
                            ctx.beginPath();
                            ctx.fill();
                        }
                        ctx.restore();
                    }

                    ctx.restore();
                }
            });
        }

        function drawDuckAvatar(canvasId, duck) {
            const c = document.getElementById(canvasId);
            if (!c) return;
            const cx = c.getContext('2d');
            cx.clearRect(0, 0, c.width, c.height);

            cx.save();
            cx.translate(c.width / 2, c.height / 2);
            cx.scale(5.5, 5.5); // Scaled to fit 300x300 (50*5.5 = 275px)

            // Shadow
            cx.shadowColor = "rgba(0,0,0,0.3)";
            cx.shadowBlur = 10;
            cx.shadowOffsetY = 5;

            // Body (Image)
            if (duckImage.complete) {
                cx.drawImage(duckImage, -25, -25, 50, 50);
            } else {
                cx.fillStyle = "#ffeb3b";
                cx.beginPath();
                cx.arc(0, 0, 20, 0, Math.PI * 2);
                cx.fill();
            }

            // ID Tag REMOVED per user request

            cx.restore();
        }

            // Collapse Panel

            // But user said "tự động ẩn panel-inner". 
            // Previous code shows .panel-inner { ... }
            document.querySelector('.panel-inner').style.display = 'none';
            document.querySelector('.controls-panel').style.flex = '0 0 0';
            document.querySelector('.controls-panel').style.borderRight = 'none';

            historyScreen.style.display = 'flex';
        }

        function closeHistory() {
            document.getElementById('history-screen').style.display = 'none';
            // Restore Panel
            document.querySelector('.panel-inner').style.display = 'flex';
            document.querySelector('.controls-panel').style.flex = '0 0 320px';
            document.querySelector('.controls-panel').style.borderRight = '2px solid rgba(113, 0, 209, 0.1)';
        }
    </script>
</body>

</html>
