<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đập Muỗi - Lucky Draw</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Roboto+Condensed:wght@700&display=swap"
        rel="stylesheet">
    <link rel="icon" href="../images.png" type="image/x-icon">
    <style>
        :root {
            --c-grass: #71B84A;
            --c-dirt: #BE784F;
            --c-cream: #F2DFB4;
            --c-sky: #84D3F4;
            --c-gold: #FFD15A;
            --c-blue: #419FE8;
            --c-red: #EF665D;
            --c-navy: #23395B;
            --c-paper: #FFFBF0;
            --toon: 'Baloo 2', 'Roboto Condensed', Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: var(--toon);
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            color: var(--c-navy);
        }

        .bg-image {
            position: fixed;
            inset: 0;
            background: url("../FINAL.jpg") center / cover no-repeat;
            z-index: -2;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: -1;
        }

        .main-game-container {
            width: 95%;
            max-width: 1400px;
            height: 90vh;
            display: flex;
            overflow: hidden;
            position: relative;
            border-radius: 20px;
            border: 4px solid var(--c-navy);
            box-shadow: 8px 8px 0 rgba(35, 57, 91, 0.85), 0 8px 32px rgba(0, 0, 0, 0.37);
            background: var(--c-sky);
        }

        /* ---------- Bảng điều khiển bên trái ---------- */
        .controls-panel {
            flex: 0 0 320px;
            background: linear-gradient(180deg, var(--c-paper) 0%, var(--c-cream) 100%);
            border-right: 4px solid var(--c-navy);
            position: relative;
            z-index: 10;
        }

        .panel-inner {
            height: 100%;
            padding: 22px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        .panel-header {
            font-weight: 800;
            font-size: 2rem;
            text-align: center;
            color: var(--c-navy);
            text-shadow: 3px 3px 0 var(--c-gold);
            line-height: 1.1;
        }

        .panel-header span {
            text-shadow: none;
        }

        .prize-card,
        .settings-form {
            background: #fff;
            border: 3px solid var(--c-navy);
            border-radius: 14px;
            box-shadow: 4px 4px 0 rgba(35, 57, 91, 0.85);
            padding: 12px 14px;
        }

        .prize-card {
            text-align: center;
        }

        .prize-name {
            font-weight: 800;
            font-size: 1.45rem;
            line-height: 1.15;
        }

        .prize-count {
            color: var(--c-blue);
            font-weight: 700;
        }

        .settings-form {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .input-group label {
            font-weight: 800;
            font-size: 0.85rem;
            line-height: 1.1;
        }

        .input-group input,
        .input-group select,
        #btn-mute {
            width: 140px;
            padding: 6px 10px;
            border-radius: 9px;
            border: 2px solid var(--c-navy);
            background: #fff;
            color: var(--c-navy);
            font-family: var(--toon);
            font-weight: 700;
            font-size: 0.9rem;
            text-align: center;
            cursor: pointer;
            outline: none;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: var(--c-blue);
            box-shadow: 0 0 0 3px rgba(65, 159, 232, 0.25);
        }

        .pool-info {
            text-align: center;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--c-blue);
            border-top: 2px dashed rgba(35, 57, 91, 0.15);
            padding-top: 6px;
        }

        .btn-action {
            width: 100%;
            padding: 11px;
            border-radius: 14px;
            border: 3px solid var(--c-navy);
            box-shadow: 0 5px 0 var(--c-navy);
            font-family: var(--toon);
            font-weight: 800;
            font-size: 1.15rem;
            color: var(--c-navy);
            background: #fff;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .btn-action:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 var(--c-navy);
        }

        .btn-action:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-start {
            background: var(--c-gold);
        }

        .btn-start:hover:not(:disabled) {
            background: #FFDD7F;
        }

        .btn-reset:hover {
            background: #E6F3FD;
        }

        .btn-nav-bottom {
            margin-top: 4px;
            padding: 10px 0;
            border: 2px solid var(--c-navy);
            border-radius: 14px;
            background: #fff;
            color: var(--c-navy);
            text-align: center;
            text-decoration: none;
            font-weight: 800;
        }

        /* ---------- Sân chơi ---------- */
        .game-stage {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #gameCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        #btn-pause {
            position: absolute;
            top: 14px;
            right: 18px;
            width: 58px;
            height: 58px;
            border-radius: 14px;
            border: 3px solid var(--c-navy);
            background: linear-gradient(180deg, #FFC24B 0%, #F59B23 100%);
            box-shadow: 0 4px 0 var(--c-navy);
            color: #fff;
            font-size: 26px;
            font-weight: 800;
            cursor: pointer;
            z-index: 60;
            display: none;
            text-shadow: 1px 1px 0 var(--c-navy);
        }

        #hit-board {
            position: absolute;
            top: 86px;
            right: 18px;
            width: 220px;
            max-height: calc(100% - 180px);
            overflow: hidden;
            background: var(--c-paper);
            border: 3px solid var(--c-navy);
            border-radius: 16px;
            box-shadow: 5px 5px 0 rgba(35, 57, 91, 0.85);
            padding: 10px 12px;
            z-index: 50;
            display: none;
        }

        .hb-title {
            text-align: center;
            font-weight: 800;
            font-size: 13px;
            color: #fff;
            background: var(--c-red);
            border: 2.5px solid var(--c-navy);
            border-radius: 999px;
            padding: 2px 0;
            margin-bottom: 6px;
            text-shadow: 1px 1px 0 var(--c-navy);
            letter-spacing: 1px;
        }

        .hb-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 0;
            border-bottom: 2px dashed rgba(35, 57, 91, 0.12);
            font-size: 13px;
            font-weight: 700;
            animation: hbIn 0.4s ease-out;
        }

        .hb-rank {
            flex: 0 0 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--c-blue);
            color: #fff;
            border: 2px solid var(--c-navy);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .hb-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .hb-code {
            color: #7C8BA3;
            font-size: 11px;
        }

        @keyframes hbIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        /* Thẻ tên khi đập trúng */
        #hit-card {
            position: absolute;
            top: 132px;
            left: 50%;
            transform: translate(-50%, 0) scale(0);
            transform-origin: 50% 0;
            min-width: 300px;
            max-width: 70%;
            background: var(--c-paper);
            border: 4px solid var(--c-navy);
            border-radius: 20px;
            box-shadow: 6px 6px 0 rgba(35, 57, 91, 0.85);
            padding: 10px 26px 14px;
            text-align: center;
            z-index: 70;
            pointer-events: none;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #hit-card.show {
            transform: translate(-50%, 0) scale(1);
        }

        .hc-tag {
            display: inline-block;
            background: var(--c-red);
            color: #fff;
            font-weight: 800;
            font-size: 15px;
            border: 2.5px solid var(--c-navy);
            border-radius: 999px;
            padding: 1px 16px;
            text-shadow: 1px 1px 0 var(--c-navy);
            letter-spacing: 1px;
        }

        .hc-names {
            font-size: 30px;
            font-weight: 800;
            line-height: 1.2;
            margin-top: 6px;
        }

        .hc-names.multi {
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 28px;
            row-gap: 4px;
            font-size: 24px;
        }

        .hc-names small {
            display: block;
            font-size: 15px;
            color: var(--c-blue);
        }

        /* Bình luận viên */
        #commentary {
            position: absolute;
            left: 34px;
            bottom: 10px;
            max-width: 62%;
            min-height: 44px;
            display: flex;
            align-items: center;
            padding: 8px 22px 8px 50px;
            background: var(--c-paper);
            border: 3px solid var(--c-navy);
            border-radius: 14px;
            box-shadow: 4px 4px 0 rgba(35, 57, 91, 0.85);
            font-size: 20px;
            font-weight: 700;
            line-height: 1.2;
            pointer-events: none;
            z-index: 60;
        }

        /* Ảnh biểu cảm nhân vật (bieucam_sprites.png: lưới 4x3, mỗi ô 180x188) thay cho icon micro */
        #avatar {
            display: none;
            position: absolute;
            left: -34px;
            bottom: -8px;
            width: 120px;
            height: 125px;
            border-radius: 20px;
            border: 3px solid var(--c-navy);
            background: var(--c-paper) url("bieucam_sprites.png") no-repeat 0 0 / 480px 375px;
            box-shadow: 4px 4px 0 rgba(35, 57, 91, 0.85);
        }

        #commentary.has-avatar {
            padding-left: 104px;
            min-height: 56px;
        }

        #commentary.has-avatar .mic {
            display: none;
        }

        #commentary.has-avatar #avatar {
            display: block;
        }

        #avatar.pop {
            animation: avatarPop 0.35s ease-out;
        }

        @keyframes avatarPop {
            from { transform: scale(0.82) rotate(-4deg); }
            60% { transform: scale(1.08) rotate(2deg); }
            to { transform: none; }
        }

        #commentary .mic {
            position: absolute;
            left: -22px;
            top: 50%;
            transform: translateY(-50%);
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--c-gold);
            border: 3px solid var(--c-navy);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 3px 0 rgba(35, 57, 91, 0.85);
        }

        #commentary b {
            color: #D9480F;
        }

        #commentary-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }

        #commentary-text.pop {
            animation: commentPop 0.35s ease-out;
        }

        @keyframes commentPop {
            from {
                opacity: 0;
                transform: translateX(14px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        /* Đếm ngược */
        #countdown {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 170px;
            font-weight: 800;
            line-height: 1;
            color: var(--c-gold);
            white-space: nowrap;
            text-shadow: 6px 0 0 var(--c-navy), -6px 0 0 var(--c-navy), 0 6px 0 var(--c-navy), 0 -6px 0 var(--c-navy),
                4px 4px 0 var(--c-navy), -4px -4px 0 var(--c-navy), 4px -4px 0 var(--c-navy), -4px 4px 0 var(--c-navy),
                0 12px 0 rgba(35, 57, 91, 0.5);
            pointer-events: none;
            z-index: 160;
        }

        #countdown.go {
            font-size: 110px;
            color: var(--c-red);
        }

        #countdown.show {
            animation: cdPop 0.85s ease-out forwards;
        }

        @keyframes cdPop {
            0% {
                transform: translate(-50%, -50%) scale(2.2);
                opacity: 0;
            }

            25%,
            80% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }

            100% {
                transform: translate(-50%, -50%) scale(0.85);
                opacity: 0;
            }
        }

        /* Cú đập cuối: tối viền + nhãn */
        .game-stage::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 40;
            box-shadow: inset 0 0 180px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .game-stage.final::after {
            opacity: 1;
        }

        #final-label {
            position: absolute;
            top: 96px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: var(--c-red);
            color: #fff;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 3px 24px;
            border: 3px solid var(--c-navy);
            border-radius: 999px;
            box-shadow: 4px 4px 0 rgba(35, 57, 91, 0.85);
            text-shadow: 2px 2px 0 var(--c-navy);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 65;
            white-space: nowrap;
        }

        .game-stage.final #final-label {
            transform: translateX(-50%) scale(1);
            animation: pfBlink 0.9s ease-in-out infinite;
        }

        @keyframes pfBlink {
            50% {
                opacity: 0.6;
            }
        }

        #pause-overlay {
            position: absolute;
            inset: 0;
            background: rgba(35, 57, 91, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 150;
            font-size: 60px;
            font-weight: 800;
            color: #fff;
            text-shadow: 4px 4px 0 var(--c-navy);
        }

        /* ---------- Màn kết quả ---------- */
        #winner-screen {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(35, 57, 91, 0.8);
            z-index: 200;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(6px);
        }

        .win-box {
            background: var(--c-paper);
            border: 4px solid var(--c-navy);
            border-radius: 30px;
            box-shadow: 8px 8px 0 rgba(35, 57, 91, 0.85);
            padding: 20px 26px;
            min-width: 600px;
            max-height: 96%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popUp {
            from {
                transform: scale(0);
            }

            to {
                transform: scale(1);
            }
        }

        .crown {
            font-size: 50px;
            animation: float 2s infinite ease-in-out;
        }

        @keyframes float {
            50% {
                transform: translateY(-10px);
            }
        }

        .win-name {
            font-size: 44px;
            font-weight: 800;
            margin: 0;
            text-shadow: 3px 3px 0 var(--c-gold);
        }

        #win-prize {
            color: var(--c-blue);
            font-size: 1.5rem;
            font-weight: 800;
        }

        #win-prize-img {
            display: none;
            width: 160px;
            height: 160px;
            object-fit: contain;
            border-radius: 15px;
            padding: 10px;
            background: #fff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        #win-list {
            display: grid;
            grid-auto-flow: column;
            grid-template-columns: 1fr 1fr;
            gap: 8px 16px;
            width: 100%;
            max-width: 760px;
        }

        #win-list.single {
            grid-template-columns: 1fr;
            max-width: 420px;
        }

        .wl-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fff;
            border: 2px solid rgba(35, 57, 91, 0.15);
            border-radius: 12px;
            padding: 6px 14px;
            font-size: 18px;
            font-weight: 700;
            min-width: 0;
        }

        .wl-rank {
            flex: 0 0 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--c-blue);
            border: 2px solid var(--c-navy);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }

        .wl-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .wl-top1 .wl-rank {
            background: #FFD54F;
            color: #333;
        }

        .wl-top2 .wl-rank {
            background: #C0C0C0;
            color: #333;
        }

        .wl-top3 .wl-rank {
            background: #CD7F32;
        }

        .wl-item.wl-hidden {
            background: #F6EEDD;
        }

        .wl-item.wl-hidden .wl-name {
            color: #B9A88A;
            letter-spacing: 4px;
        }

        .wl-item.wl-reveal {
            animation: wlReveal 0.5s cubic-bezier(0.17, 0.89, 0.32, 1.28);
        }

        .wl-top1.wl-reveal {
            box-shadow: 0 0 0 3px #FFD54F, 0 0 26px rgba(255, 193, 7, 0.85);
        }

        @keyframes wlReveal {
            from {
                transform: scale(0.6);
                opacity: 0.2;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>

    <audio id="bgMusic" loop>
        <source src="../audio/Nh%E1%BA%A1c%20Quay%20s%E1%BB%91%20JackPot.MP3" type="audio/mpeg">
    </audio>

    <div class="main-game-container">
        <!-- BẢNG ĐIỀU KHIỂN -->
        <div class="controls-panel" id="controls-panel">
            <div class="panel-inner">
                <div class="panel-header">ĐẬP MUỖI <span>🦟</span></div>

                <div class="prize-card">
                    <div class="prize-name" id="prize-name">ĐANG TẢI...</div>
                    <div class="prize-count" id="prize-count">---</div>
                </div>

                <div class="settings-form">
                    <div class="input-group">
                        <label>ÂM THANH</label>
                        <button id="btn-mute" onclick="toggleMusic()">🔊 BẬT NHẠC</button>
                    </div>
                    <div class="input-group">
                        <label>CHỌN QUÀ</label>
                        <select id="inp-prize" onchange="changePrize()">
                            <option value="-1">---</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>LUẬT THẮNG</label>
                        <select id="inp-rule" onchange="updateModeUI()">
                            <option value="hit">🎯 Bị đập trúng</option>
                            <option value="survive">🛡️ Sống sót cuối</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>SỐ NGƯỜI THẮNG</label>
                        <select id="inp-mode" onchange="updateModeUI()">
                            <option value="one">1 người</option>
                            <option value="multi">Nhiều người</option>
                        </select>
                    </div>
                    <div class="input-group" id="grp-winners" style="display:none">
                        <label>SỐ LƯỢNG</label>
                        <input type="number" id="inp-winners" value="10" min="2" max="50">
                    </div>
                    <div class="input-group">
                        <label>THỜI GIAN (giây)</label>
                        <input type="number" id="inp-time" value="30" min="10" max="300">
                    </div>
                    <div class="input-group">
                        <label>CÔNG CỤ</label>
                        <select id="inp-tool">
                            <option value="hand">🖐️ Tay không</option>
                            <option value="racket">🏸 Vợt điện</option>
                            <option value="spray">🧴 Bình xịt</option>
                            <option value="random">🎲 Ngẫu nhiên</option>
                        </select>
                    </div>
                    <div class="input-group" id="grp-style">
                        <label>KIỂU ĐẬP</label>
                        <select id="inp-style">
                            <option value="single">Từng con</option>
                            <option value="cluster">Theo cụm (2–4 con)</option>
                        </select>
                    </div>
                    <div class="pool-info" id="pool-info">Đang tải danh sách...</div>
                </div>

                <button class="btn-action btn-start" id="btn-start" onclick="startGame()">🏁 BẮT ĐẦU</button>
                <button class="btn-action btn-reset" onclick="location.reload()">🔄 LÀM MỚI</button>
                <button class="btn-action btn-reset" onclick="clearWinnersCache()"
                    title="Xóa lịch sử trúng giải và đưa người đã trúng về lại danh sách tham gia">🧹 XÓA CACHE</button>
                <a href="../index.html" class="btn-nav-bottom">⬅ QUAY VỀ MENU</a>
            </div>
        </div>

        <!-- SÂN CHƠI -->
        <div class="game-stage" id="gameStage">
            <canvas id="gameCanvas"></canvas>
            <button id="btn-pause" onclick="togglePause()" title="Tạm dừng (phím P)">❚❚</button>
            <div id="hit-board">
                <div class="hb-title" id="hb-title">DANH SÁCH TRÚNG</div>
                <div id="hb-list"></div>
            </div>

    <script>
        // =====================================================================
        // CẤU HÌNH & BẢNG MÀU
        // =====================================================================
        const PAL = { grass: "#71B84A", dirt: "#BE784F", cream: "#F2DFB4", sky: "#84D3F4", gold: "#FFD15A", blue: "#419FE8", red: "#EF665D", navy: "#23395B", paper: "#FFFBF0" };
        const INK = PAL.navy;
        const FONT = "'Baloo 2', 'Roboto Condensed', Arial, sans-serif";
        // Số muỗi = số người tham gia. Đông người thì đàn muỗi bay nhỏ lại cho vừa trời (con bị nhắm sẽ to lên khi sà xuống)
        let swarmZoom = 1, labelScale = 0.62;
        function calcSwarmZoom(n) {
            const b = skyBounds(), area = (b.x1 - b.x0) * (b.y1 - b.y0 + 80);
            return clamp(Math.sqrt(area * 0.9 / (Math.max(1, n) * 4200)), 0.45, 1);

        function setSwarm(n) { swarmZoom = calcSwarmZoom(n); }

        // Tên dưới con muỗi (chỉ hiện khi bay gần cô gái) – vẽ sẵn ra ảnh một lần cho nhẹ máy
        function makeLabel(text) {

            g.font = `800 22px ${FONT}`;
            c.width = Math.ceil(g.measureText(text).width) + 14; c.height = 34;
            g.font = `800 22px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
            g.lineWidth = 7; g.strokeStyle = 'rgba(255, 255, 255, 0.95)'; g.strokeText(text, c.width / 2, 17);

        }
        if (document.fonts) document.fonts.ready.then(() => mosquitoes.forEach(m => m.labelImg = null));   // font tải xong thì vẽ lại tên

        // Chia bầu trời thành lưới, mỗi con muỗi có một ô "nhà" để đàn muỗi rải đều, tên dễ đọc hơn
        let homeCell = { w: 100, h: 60 };
        function assignHomes(list) {
            if (!list.length) return;
            const b = skyBounds(), bw = b.x1 - b.x0, bh = b.y1 - b.y0 + 60;
            const cols = Math.max(1, Math.round(Math.sqrt(list.length * bw / bh))), rows = Math.ceil(list.length / cols);
            homeCell = { w: bw / cols, h: bh / rows };
            const cells = fairShuffle([...Array(cols * rows).keys()]);
            list.forEach((m, k) => { const c = cells[k]; m.hx = b.x0 + (c % cols + 0.5) * homeCell.w; m.hy = b.y0 - 30 + (Math.floor(c / cols) + 0.5) * homeCell.h; });
        }
        const HERO_SCALE = 1.15;
        const WINDUP = 0.2;       // thời gian lấy đà trước cú đập (giây)

        // ---------- Nhân vật bằng ảnh: nhanvat_sprites.png (8 khung 266x477, gốc = giữa hai bàn chân ở đáy khung) ----------
        // 0 đứng chờ | 1 giơ vợt lấy đà | 2 vợt qua đầu | 3 vung vợt trúng | 4 vồ hụt | 5 chạy | 6 đi bộ | 7 ăn mừng
        // Thiếu file ảnh thì tự dùng lại nhân vật vẽ bằng code.
        const HSPR = { cw: 266, ch: 477, ax: 133, ay: 474, dir: [1, 1, 1, 1, -1, 1, 1, 1], racket: [80, -170], ready: false, img: null };

        })();
        const heroSprScale = () => clamp(H * 0.30 / 435, 0.35, 0.75);   // cao khoảng 30% khung hình
        const TOOL_INFO = {
            hand: { label: "Tay không", word: "BỐP!", color: PAL.red },

        // ---------- Ảnh muỗi: muoi_sprites.png (8 khung 236x223; hàng 1: thân, hàng 2-3: hai cánh tách riêng để vẫy) ----------
        // Khung: 0,1,3 bay lè lưỡi | 2 bay hung hăng | 4 giật mình | 5 nháy mắt né | 6 choáng váng | 7 nằm ngửa
        // Thiếu file ảnh thì tự dùng lại muỗi vẽ bằng code.
        const SPR = {
            cw: 236, ch: 223, scale: 0.36, ready: false, layers: {},
            dir: [1, 1, 1, 1, 1, 1, 1, 1],                           // hướng mặt gốc của từng khung (-1: trái, 1: phải)
            // gốc cánh [x, y, chiều vẫy] trong khung, cánh xoay quanh điểm này
            wings: [[[97.5, 110, 1], [94, 99.5, 1]], [[92.5, 109, 1]], [[91, 112, 1], [94, 119, 1]], [[100.5, 108.5, 1], [98.5, 100, 1]], [[99.5, 115, 1], [94, 104.5, 1]], [[89, 110, 1], [87.5, 90.5, 1]], [[95.5, 92.5, 1], [77, 120, 1]], [[143, 136.5, -1], [149.5, 134.5, -1]]],
            // mắt để chớp (khung 0-3): [tâm x, tâm y, bán kính ngang, bán kính dọc] + màu mí mắt (màu da đầu muỗi)
            eyes: [[[132, 88.5, 7.2, 8.8], [160, 91.2, 5.8, 7.5]], [[129.2, 90.2, 7.5, 9.5], [158.5, 95.5, 6.2, 8.8]], [[132.8, 101, 7.5, 9.2], [161, 103, 6.2, 8.8]], [[139.5, 96.2, 7.2, 9], [167.5, 102.2, 6.2, 8.5]]],
            lid: ["#6d6865", "#696461", "#6b6662", "#6b6663"],
            lidGold: "#a38d4c", lidLine: "#1E1E1E",
            deadBottom: 77                                  // khoảng từ tâm tới đáy khung "nằm ngửa"
        };
        (function loadMosquitoSprites() {
            const img = new Image();
            img.onload = () => {
                ['normal', 'gold', 'burnt'].forEach(v => {
                    SPR.layers[v] = [0, 1, 2].map(row => SPR.dir.map((_, i) => {   // row 0: thân, 1-2: cánh
                        const c = document.createElement('canvas'); c.width = SPR.cw; c.height = SPR.ch;
                        const g = c.getContext('2d');
                        g.drawImage(img, i * SPR.cw, row * SPR.ch, SPR.cw, SPR.ch, 0, 0, SPR.cw, SPR.ch);
                        if (v !== 'normal') {   // phủ màu: vàng cho cú cuối, cháy đen khi dính vợt điện
                            g.globalCompositeOperation = 'source-atop';
                            g.fillStyle = v === 'gold' ? 'rgba(255, 205, 40, 0.38)' : 'rgba(25, 25, 25, 0.6)';
                            g.fillRect(0, 0, SPR.cw, SPR.ch);

                        return c;
                    }));
                });
                // bản thu nhỏ 1/2 cho đàn muỗi bay xa (vẽ nhẹ máy hơn khi có hàng trăm con)
                SPR.layers.small = SPR.layers.normal.map(row => row.map(c => {
                    const sc = document.createElement('canvas'); sc.width = SPR.cw / 2; sc.height = Math.ceil(SPR.ch / 2);
                    const g = sc.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(c, 0, 0, sc.width, sc.height);
                    return sc;
                }));
                SPR.ready = true;
            };
            img.onerror = () => console.warn('Không tải được muoi_sprites.png – dùng muỗi vẽ bằng code.');
            img.src = 'muoi_sprites.png';
        })();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const stage = document.getElementById('gameStage');
        let W = 0, H = 0, groundY = 0;

        // Ảnh nền sân vườn (nen_vuon.jpg). Thiếu file thì tự vẽ nền trời xanh như cũ.
        const BG = { img: null, cache: null, feet: 0.885 };   // feet: vị trí mặt cỏ chỗ nhân vật đứng (tính theo chiều cao ảnh)
        (function loadBackground() {
            const img = new Image();
            img.onload = () => { BG.img = img; resize(); refitSwarm(); };
            img.src = 'nen_vuon.jpg';
        })();
        function resize() {
            const dpr = window.devicePixelRatio || 1;
            W = stage.clientWidth; H = stage.clientHeight;
            canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            groundY = H - 78;
            BG.cache = null;
            if (BG.img && W > 0 && H > 0) {
                // phủ kín khung (giữ tỉ lệ, canh đáy ảnh) rồi vẽ sẵn ra 1 lớp cho nhẹ máy
                const iw = BG.img.width, ih = BG.img.height, k = Math.max(W / iw, H / ih);
                const dw = iw * k, dh = ih * k, dx = (W - dw) / 2, dy = H - dh;
                const c = document.createElement('canvas'); c.width = canvas.width; c.height = canvas.height;
                const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.imageSmoothingQuality = 'high';
                g.drawImage(BG.img, dx, dy, dw, dh);
                BG.cache = c;
                groundY = Math.min(H - 40, dy + dh * BG.feet);
            }
        }
        window.addEventListener('resize', () => { resize(); refitSwarm(); });

        // Ngẫu nhiên công bằng (dùng bộ sinh số ngẫu nhiên của trình duyệt)
        function fairRandom() {
            const a = new Uint32Array(1);
            (window.crypto || window.msCrypto).getRandomValues(a);
            return a[0] / 4294967296;
        }
        function fairShuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(fairRandom() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
        const rnd = (a, b) => a + Math.random() * (b - a);
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const esc = v => String(v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        // =====================================================================
        // HỌ TÊN / MÃ NV (file nhập "STT | Họ tên | Mã NV" bị lưu đảo -> tự nhận diện)
        // =====================================================================
        let namesSwapped = false;
        function looksLikeCode(v) { v = String(v || '').trim(); return !!v && !/\s/.test(v) && (/\d/.test(v) || /^[A-Z]{2,}$/.test(v)); }
        function detectSwapped(list) {
            let a = 0, b = 0;
            list.forEach(p => { if (looksLikeCode(p && p.name)) a++; if (looksLikeCode(p && p.id)) b++; });
            return a > b;
        }
        function splitPerson(p) {
            const n = String((p && p.name) || '').trim(), i = String((p && p.id) || '').trim();
            if (looksLikeCode(n) && !looksLikeCode(i)) return { name: i || n, code: n };
            if (looksLikeCode(i) && !looksLikeCode(n)) return { name: n || i, code: i };
            return namesSwapped ? { name: i || n, code: i ? n : '' } : { name: n || i, code: n ? i : '' };
        }
        const personName = p => splitPerson(p).name;
        const personCode = p => splitPerson(p).code;
        // Khóa nhận diện đúng 1 người: cặp (Họ tên, Mã NV), không phân biệt thứ tự cột
        function personKey(a, b) {
            const x = String(a || '').trim(), y = String(b || '').trim();
            return x < y ? x + '\u0001' + y : y + '\u0001' + x;
        }

        // Danh sách người chưa trúng (loại người đã có trong lịch sử trúng giải)
        function loadRemaining() {
            let list = [], winners = [];
            try { list = JSON.parse(localStorage.getItem('lucky_draw_participants') || '[]'); } catch (e) { }
            try { winners = JSON.parse(localStorage.getItem('lucky_draw_winners') || '[]'); } catch (e) { }
            if (!Array.isArray(list)) list = [];
            if (!Array.isArray(winners)) winners = [];
            const keys = new Set(winners.filter(w => w && (w.id || w.name)).map(w => personKey(w.name, w.id)));
            return list.filter(p => p && (p.name || p.id) && !keys.has(personKey(p.name, p.id)));
        }

        // =====================================================================
        // QUÀ & CÀI ĐẶT
        // =====================================================================
        let prizes = [], currentPrizeIndex = -1;

        function loadPrizes() {
            try { prizes = JSON.parse(localStorage.getItem('lucky_draw_prizes') || '[]'); } catch (e) { prizes = []; }
            if (!Array.isArray(prizes)) prizes = [];
            currentPrizeIndex = prizes.findIndex(p => p.quantity > 0);
            updatePrizeUI();
        }

        function updatePrizeUI() {
            const select = document.getElementById('inp-prize');
            select.innerHTML = '<option value="-1">---</option>';
            prizes.forEach((p, idx) => {
                const opt = document.createElement('option');
                opt.value = idx; opt.text = `${p.name} (${p.quantity})`;
                if (p.quantity <= 0) opt.disabled = true;
                select.appendChild(opt);
            });
            const nameEl = document.getElementById('prize-name'), countEl = document.getElementById('prize-count');
            if (currentPrizeIndex !== -1) {
                const p = prizes[currentPrizeIndex];
                nameEl.innerText = p.name; countEl.innerText = `Còn lại: ${p.quantity}`;
                select.value = currentPrizeIndex;
            } else {
                nameEl.innerText = "CHƯA CÓ QUÀ"; countEl.innerText = "Nhập danh sách quà ở trang chủ";
            }
            document.getElementById('btn-start').disabled = currentPrizeIndex === -1;
        }

        function changePrize() {
            const v = parseInt(document.getElementById('inp-prize').value);
            if (v !== -1) { currentPrizeIndex = v; updatePrizeUI(); }
        }

        function updateModeUI() {
            document.getElementById('grp-winners').style.display = document.getElementById('inp-mode').value === 'multi' ? '' : 'none';
            // luật "sống sót" tự đập theo đợt (đông thì đập cả đàn), không cần chọn kiểu đập
            document.getElementById('grp-style').style.display = document.getElementById('inp-rule').value === 'survive' ? 'none' : '';
        }

        const SETTINGS = ['inp-rule', 'inp-mode', 'inp-winners', 'inp-time', 'inp-tool', 'inp-style'];
        function loadSettings() {
            SETTINGS.forEach(id => {
                try { const v = localStorage.getItem('mosq_' + id); if (v !== null) document.getElementById(id).value = v; } catch (e) { }
            });
            updateModeUI();
        }
        function saveSettings() {
            SETTINGS.forEach(id => { try { localStorage.setItem('mosq_' + id, document.getElementById(id).value); } catch (e) { } });
        }

        function updatePoolInfo() {
            const n = loadRemaining().length;
            document.getElementById('pool-info').innerText = n ? `Danh sách: ${n} người chưa trúng` : 'Chưa có ai trong danh sách tham gia';
        }

        // =====================================================================
        // ÂM THANH (tự tổng hợp, không cần file)
        // =====================================================================
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioCtx();
        let noiseBuffer = null, fireworksInterval = null;
        function getNoise() {
            if (!noiseBuffer) {
                noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
                const d = noiseBuffer.getChannelData(0);
                for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
            }
            return noiseBuffer;
        }
        function tone(type, f0, f1, t, dur, vol) {
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
            g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
            o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + dur + 0.02);
        }
        function noise(t, dur, vol, filterType, freq, q) {
            const src = audioCtx.createBufferSource(); src.buffer = getNoise();
            const f = audioCtx.createBiquadFilter(); f.type = filterType; f.frequency.value = freq; if (q) f.Q.value = q;
            const g = audioCtx.createGain();
            g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
            src.connect(f); f.connect(g); g.connect(audioCtx.destination);
            src.start(t, Math.random(), dur + 0.05);
        }
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            switch (type) {
                case 'beep': tone('square', 660, 0, now, 0.25, 0.18); break;
                case 'go': tone('square', 880, 0, now, 0.4, 0.15); tone('square', 1320, 0, now + 0.12, 0.45, 0.15); break;
                case 'whoosh': noise(now, 0.22, 0.35, 'bandpass', 1200, 1.2); break;
                case 'smack': noise(now, 0.09, 0.8, 'lowpass', 1500); tone('sine', 160, 50, now, 0.15, 0.35); break;
                case 'zap':
                    for (let i = 0; i < 6; i++) tone('sawtooth', rnd(1500, 3200), rnd(600, 1200), now + i * 0.035, 0.05, 0.07);
                    noise(now, 0.25, 0.25, 'highpass', 3000); break;
                case 'spray': noise(now, 0.7, 0.22, 'highpass', 4500); break;
                case 'miss': tone('triangle', 700, 260, now + 0.05, 0.3, 0.15); break;
                case 'buzz': {
                    const o = audioCtx.createOscillator(), lfo = audioCtx.createOscillator(), lg = audioCtx.createGain(), g = audioCtx.createGain(), f = audioCtx.createBiquadFilter();
                    o.type = 'sawtooth'; o.frequency.value = 560; lfo.frequency.value = 18; lg.gain.value = 25;
                    lfo.connect(lg); lg.connect(o.frequency); f.type = 'lowpass'; f.frequency.value = 1800;
                    g.gain.setValueAtTime(0.001, now); g.gain.linearRampToValueAtTime(0.035, now + 0.2); g.gain.linearRampToValueAtTime(0.001, now + 0.9);
                    o.connect(f); f.connect(g); g.connect(audioCtx.destination); o.start(now); lfo.start(now); o.stop(now + 0.95); lfo.stop(now + 0.95);
                    break;
                }
                case 'cheer':
                    [[1100, 0.7, 0.3], [450, 0.9, 0.2]].forEach(([fr, q, v]) => {
                        const src = audioCtx.createBufferSource(); src.buffer = getNoise(); src.loop = true;
                        const bp = audioCtx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = fr; bp.Q.value = q;
                        const g = audioCtx.createGain();
                        g.gain.setValueAtTime(0.001, now); g.gain.exponentialRampToValueAtTime(v, now + 0.3);
                        g.gain.setValueAtTime(v, now + 1.2); g.gain.exponentialRampToValueAtTime(0.001, now + 2.4);
                        src.connect(bp); bp.connect(g); g.connect(audioCtx.destination); src.start(now); src.stop(now + 2.5);
                    });
                    break;
                case 'reveal': tone('sine', 1046, 0, now, 0.6, 0.2); tone('sine', 1568, 0, now + 0.08, 0.6, 0.2); break;
                case 'win': [523, 659, 784, 1046].forEach((f, i) => tone('square', f, 0, now + i * 0.1, 0.3, 0.06)); break;
                case 'fireworks_start':
                    if (fireworksInterval) clearInterval(fireworksInterval);
                    const burst = () => { const t = audioCtx.currentTime; for (let i = 0; i < 10; i++) noise(t + Math.random() * 1.5, rnd(0.1, 0.3), 0.4, 'lowpass', rnd(500, 1500)); };
                    burst(); fireworksInterval = setInterval(burst, 1000);
                    break;
            }
        }

        const bgMusic = document.getElementById('bgMusic'), btnMute = document.getElementById('btn-mute');
        function toggleMusic() {
            if (bgMusic.paused) bgMusic.play().then(updateMuteButton).catch(() => { });

        // =====================================================================
        // BÌNH LUẬN VIÊN
        // =====================================================================
        let lastAnnounce = 0;
        function announce(html, force) {
            const now = Date.now();
            if (!force && now - lastAnnounce < 1800) return;
            lastAnnounce = now;
            const el = document.getElementById('commentary-text');
